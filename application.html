<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Application Tracker | Fourth Year</title>

  <script src="https://cdn.tailwindcss.com"></script>


  <style>

    :root {

      --bg-app: #FAF9F5;
      --bg-surface: #FFFFFF;

      --text-charcoal: #2D3132;
      --text-gray: #6B7280;

      --accent-terracotta: #C86D51;
      --accent-sage: #8E9B88;

      --soft-sage: #EEF1EB;
      --soft-terracotta: #FBF4F1;

      --border-light: #E5E0D8;

    }


    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      min-height: 100%;

    }


    body {

      background:
        var(--bg-app);

      color:
        var(--text-charcoal);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;

    }


    button,
    input,
    textarea {

      font: inherit;

    }


    a {

      color: inherit;

    }



    /* =====================================================
       COLLAPSED / EXPANDED LEFT NAVIGATION
    ===================================================== */


    .left-navigation {

      position: fixed;

      top: 0;
      left: 0;

      width: 88px;
      height: 100vh;

      z-index: 50;

      padding:
        28px
        18px;

      background:
        var(--bg-app);

      transition:
        width
        0.22s
        ease;

    }


    .left-navigation.open {

      width: 245px;

    }


    .nav-top {

      display: flex;

      align-items: center;

      gap: 15px;

      white-space: nowrap;

    }


    .menu-button {

      width: 42px;
      height: 42px;

      display: flex;

      align-items: center;
      justify-content: center;

      flex-shrink: 0;

      border: 0;

      border-radius: 9px;

      background:
        transparent;

      color:
        var(--text-charcoal);

      cursor: pointer;

      font-size: 24px;

      line-height: 1;

    }


    .menu-button:hover {

      background:
        #F5F2EC;

      color:
        var(--accent-terracotta);

    }


    .nav-brand {

      opacity: 0;

      pointer-events: none;

      color:
        var(--accent-sage);

      font-size: 14px;

      font-weight: 600;

      letter-spacing: 0.20em;

      text-transform: uppercase;

      transition:
        opacity
        0.15s
        ease;

    }


    .left-navigation.open
    .nav-brand {

      opacity: 1;

    }


    .nav-links {

      margin-top: 27px;

      opacity: 0;

      pointer-events: none;

      transform:
        translateX(-5px);

      transition:
        opacity
        0.18s
        ease,
        transform
        0.18s
        ease;

    }


    .left-navigation.open
    .nav-links {

      opacity: 1;

      pointer-events: auto;

      transform:
        translateX(0);

    }


    .menu-link {

      display: block;

      width: max-content;

      padding:
        7px
        0;

      color:
        var(--accent-sage);

      text-decoration: none;

      font-size: 13px;

      font-weight: 500;

      letter-spacing: 0.15em;

      text-transform: uppercase;

      transition:
        color
        0.15s
        ease;

    }


    .menu-link:hover {

      color:
        var(--accent-terracotta);

    }


    .menu-link.active {

      color:
        var(--accent-terracotta);

      font-weight: 600;

    }



    /* =====================================================
       PAGE LAYOUT
    ===================================================== */


    .page-shell {

      margin-left: 92px;

      padding:
        27px
        30px
        42px;

      transition:
        margin-left
        0.22s
        ease;

    }


    body.menu-open
    .page-shell {

      margin-left: 255px;

    }


    .content-shell {

      width: 100%;

      max-width: 1320px;

      margin:
        0
        auto;

    }


    .page-title {

      margin:
        4px
        0
        30px;

      text-align: center;

      color:
        var(--accent-sage);

      font-size: 34px;

      font-weight: 300;

      line-height: 1;

      letter-spacing: 0.105em;

      text-transform: uppercase;

      white-space: nowrap;

    }


    .section-label {

      color:
        var(--accent-sage);

      font-size: 10px;

      font-weight: 600;

      letter-spacing: 0.16em;

      text-transform: uppercase;

    }


    .content-card {

      background:
        white;

      border:
        1px
        solid
        var(--border-light);

      border-radius: 12px;

    }



    /* =====================================================
       APPLICATION TRACKER PLACEHOLDER
    ===================================================== */


    .application-shell {

      min-height: 420px;

      padding:
        24px;

    }


    .placeholder-content {

      display: flex;

      align-items: center;
      justify-content: center;

      min-height: 350px;

      text-align: center;

    }


    .placeholder-text {

      max-width: 420px;

      color:
        var(--text-gray);

      font-size: 12px;

      line-height: 1.6;

    }


    @media (
      max-width: 700px
    ) {

      .left-navigation {

        width: 68px;

        padding:
          18px
          12px;

      }


      .left-navigation.open {

        width: 225px;

      }


      .page-shell {

        margin-left: 72px;

        padding:
          20px
          16px
          40px;

      }


      body.menu-open
      .page-shell {

        margin-left: 72px;

      }


      .page-title {

        font-size: 28px;

      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       LEFT NAVIGATION
  ====================================================== -->

  <aside
    id="leftNavigation"
    class="left-navigation"
  >

    <div class="nav-top">

      <button
        id="menuButton"
        class="menu-button"
        aria-label="Open menu"
        aria-expanded="false"
      >
        ☰
      </button>


      <div class="nav-brand">

        Fourth Year

      </div>

    </div>


    <nav class="nav-links">

      <a
        href="index.html"
        class="menu-link"
      >
        Home
      </a>


      <a
        href="step.html"
        class="menu-link"
      >
        Step & Study
      </a>


      <a
        href="programs.html"
        class="menu-link"
      >
        Program Explorer
      </a>


      <a
        href="application.html"
        class="menu-link active"
      >
        Application Tracker
      </a>


      <a
        href="schedule.html"
        class="menu-link"
      >
        4th Year Schedule
      </a>

    </nav>

  </aside>



  <!-- =====================================================
       PAGE
  ====================================================== -->

  <main class="page-shell">


    <div class="content-shell">


      <h1 class="page-title">

        Application Tracker

      </h1>



      <section class="content-card application-shell">


        <div class="section-label">

          Residency Application

        </div>


        <div class="placeholder-content">

          <div class="placeholder-text">

            Application tracker content will go here.

          </div>

        </div>


      </section>


    </div>


  </main>



  <script>


    /* =====================================================
       NAVIGATION
    ===================================================== */


    const leftNavigation =
      document.getElementById(
        'leftNavigation'
      );


    const menuButton =
      document.getElementById(
        'menuButton'
      );


    function toggleMenu() {

      const opening =
        !leftNavigation
          .classList
          .contains(
            'open'
          );


      leftNavigation
        .classList
        .toggle(
          'open',
          opening
        );


      document.body
        .classList
        .toggle(
          'menu-open',
          opening
        );


      menuButton
        .setAttribute(
          'aria-expanded',
          opening
            ? 'true'
            : 'false'
        );


      menuButton.textContent =
        opening
          ? '×'
          : '☰';

    }


    menuButton
      .addEventListener(
        'click',
        toggleMenu
      );


  </script>


</body>

</html>

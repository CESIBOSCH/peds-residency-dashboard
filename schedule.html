;padding:0!important;border:0!important}

    /* Rotation archive cards */

    .rotation-detail-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px 28px;padding-top:15px}.rotation-detail-span{grid-column:1/-1}.rotation-detail-label{color:var(--sage);font-size:9px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;margin-bottom:6px}.rotation-detail-input,.rotation-detail-area{width:100%;border:1px solid var(--border);border-radius:8px;background:#FCFBF8;color:var(--text);outline:none;font:inherit}.rotation-detail-input{height:34px;padding:6px 8px;font-size:11px}.rotation-detail-area{min-height:74px;padding:8px 9px;resize:vertical;font-size:11px;line-height:1.45}.rotation-detail-input:focus,.rotation-detail-area:focus{border-color:var(--sage);background:#fff}.rotation-contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.rotation-contact-stack{display:grid;gap:7px}.rotation-detail-help{color:var(--muted);font-size:8.5px;margin-top:5px}.rotation-auto-note{color:var(--sage);font-size:9px;margin:5px 0 0}

    @media(max-width:1500px){.grid.expanded .rotation-header-wrap{grid-template-columns:minmax(320px,1fr) minmax(390px,.95fr) auto!important;column-gap:22px!important}.grid.expanded .rotation-header-contacts{grid-template-columns:minmax(180px,1fr) minmax(210px,1fr)!important;gap:18px!important}.grid.expanded .rotation-header-contacts a{font-size:10.5px!important}}
  `;
  doc.head.appendChild(style);

  const nav=doc.querySelector('.nav'),menu=nav?.querySelector('.menu');
  if(nav&&menu){let navTop=nav.querySelector('.nav-top');if(!navTop){navTop=doc.createElement('div');navTop.className='nav-top';nav.insertBefore(navTop,nav.firstChild);navTop.appendChild(menu)}let brand=navTop.querySelector('.nav-brand');if(!brand){brand=doc.createElement('a');brand.className='nav-brand';brand.href='index.html';brand.textContent='Fourth Year';navTop.appendChild(brand)}[...nav.querySelectorAll('.links a')].forEach(link=>{const href=(link.getAttribute('href')||'').split('/').pop();link.classList.toggle('active',href==='schedule.html')});const syncNav=()=>{const isOpen=nav.classList.contains('open');doc.body.classList.toggle('nav-open',isOpen);menu.textContent=isOpen?'×':'☰';menu.setAttribute('aria-label',isOpen?'Close menu':'Open menu')};syncNav();new MutationObserver(syncNav).observe(nav,{attributes:true,attributeFilter:['class']})}

  const rotationEl=doc.querySelector('.rotation'),head=rotationEl?.querySelector('.rotation-head'),reference=rotationEl?.querySelector('.rotation-reference'),assignments=rotationEl?.querySelector('.rotation-assignments'),priorityGrid=rotationEl?.querySelector('.priority-grid'),notes=rotationEl?.querySelector('.notes-priority'),encounters=rotationEl?.querySelector('.encounters-secondary');
  if(rotationEl&&head&&reference&&assignments&&priorityGrid&&notes&&encounters){const panels=[...priorityGrid.querySelectorAll('.priority-panel')],concepts=panels.find(p=>p.textContent.includes('Concepts to Review')),resources=panels.find(p=>p.textContent.includes('Helpful Resources'));if(concepts)concepts.classList.add('concepts-panel');if(resources)resources.classList.add('resources-panel');let headerWrap=rotationEl.querySelector('.rotation-header-wrap');if(!headerWrap){headerWrap=doc.createElement('div');headerWrap.className='rotation-header-wrap';rotationEl.insertBefore(headerWrap,head);headerWrap.appendChild(head)}const collapseBtn=head.querySelector('.expand')||rotationEl.querySelector('.rotation-header-collapse');if(collapseBtn){collapseBtn.classList.add('rotation-header-collapse');if(collapseBtn.parentElement!==headerWrap)headerWrap.appendChild(collapseBtn)}let meta=headerWrap.querySelector('.rotation-header-meta');const location=reference.querySelector('.reference-location #rotationLocation');if(!meta){meta=doc.createElement('div');meta.className='rotation-header-meta';headerWrap.appendChild(meta)}if(location&&!meta.contains(location))meta.appendChild(location);let contactsWrap=headerWrap.querySelector('.rotation-header-contacts');const sourceContacts=reference.querySelector('.reference-contacts');if(!contactsWrap){contactsWrap=doc.createElement('div');contactsWrap.className='rotation-header-contacts';headerWrap.appendChild(contactsWrap)}if(sourceContacts){[...sourceContacts.querySelectorAll('.contact')].forEach(contact=>{[...contact.querySelectorAll('br')].forEach(br=>br.remove());contactsWrap.appendChild(contact)})}const syllabus=reference.querySelector('.reference-syllabus,.syllabus');if(syllabus)syllabus.remove();rotationEl.insertBefore(assignments,headerWrap.nextSibling);priorityGrid.innerHTML='';if(resources)priorityGrid.appendChild(resources);if(concepts)priorityGrid.appendChild(concepts);rotationEl.insertBefore(priorityGrid,assignments.nextSibling);rotationEl.insertBefore(notes,priorityGrid.nextSibling);rotationEl.insertBefore(encounters,notes.nextSibling)}

  /* Full rotation lifecycle + saved per-rotation details. */
  const rotationDefinitions=[
    {id:'peds-ai',name:'Peds AI',start:'2026-06-22',end:'2026-07-19'},
    {id:'fm-ai',name:'Family Medicine AI',start:'2026-07-20',end:'2026-08-16'},
    {id:'peds-heme-onc',name:'Pediatrics Hematology / Oncology',start:'2026-08-17',end:'2026-09-13'},
    {id:'geri-pal',name:'Geri Pal',start:'2026-09-28',end:'2026-10-11'},
    {id:'picu',name:'PICU',start:'2026-10-12',end:'2026-11-08'},
    {id:'interview',name:'Interview Block',start:'2026-11-09',end:'2026-12-06'},
    {id:'mfm',name:'Outpatient MFM',start:'2026-12-07',end:'2027-01-17'},
    {id:'child-protection',name:'Child Protection',start:'2027-01-19',end:'2027-02-14'},
    {id:'global-health',name:'Global Health Spain',start:'2027-02-15',end:'2027-03-14'}
  ];
  const DETAILS_KEY='fourthYearRotationDetailsV1';
  const loadDetails=()=>{try{return JSON.parse(frame.contentWindow.localStorage.getItem(DETAILS_KEY)||'{}')}catch(e){return{}}};
  const saveDetails=d=>frame.contentWindow.localStorage.setItem(DETAILS_KEY,JSON.stringify(d));
  const blankDetails=r=>({name:r.name,location:'',director:{name:'',email:''},coordinator:{name:'',email:'',phone:''},assignments:'',resources:'',concepts:'',notes:'',encounters:''});
  let detailStore=loadDetails();
  if(!detailStore['peds-heme-onc'])detailStore['peds-heme-onc']={name:'Pediatrics Hematology / Oncology',location:'Medical Center Plaza',director:{name:'Dr. David Gass',email:'david.gass@advocatehealth.org'},coordinator:{name:'Alexis Miller',email:'alexis.miller@advocatehealth.org',phone:'336-580-2500'},assignments:'Mid-Rotation Feedback Form\n15-minute Journal Article Presentation\nEnd of Course Evaluation',resources:'',concepts:'',notes:'',encounters:''};
  rotationDefinitions.forEach(r=>{if(!detailStore[r.id])detailStore[r.id]=blankDetails(r)});saveDetails(detailStore);
  const fmtDate=s=>new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  const fmtRange=r=>`${fmtDate(r.start)} – ${fmtDate(r.end)}`;
  const todayKey=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
  const currentIndex=()=>{const t=todayKey();const ix=rotationDefinitions.findIndex(r=>r.end>=t);return ix<0?rotationDefinitions.length-1:ix};

  function detailCard(r){const d=detailStore[r.id]||blankDetails(r),a=doc.createElement('article');a.className='rotation-mini';a.dataset.rotationId=r.id;a.innerHTML=`<button type="button"><div><div class="rname">${r.name}</div><div class="rmeta">${fmtRange(r)}</div></div></button><div class="body"><div class="rotation-detail-grid"><div><div class="rotation-detail-label">Location</div><input class="rotation-detail-input" data-path="location" value="${esc(d.location)}"></div><div><div class="rotation-detail-label">Contacts</div><div class="rotation-contact-grid"><div class="rotation-contact-stack"><input class="rotation-detail-input" data-path="director.name" placeholder="Course director" value="${esc(d.director?.name||'')}"><input class="rotation-detail-input" data-path="director.email" placeholder="Director email" value="${esc(d.director?.email||'')}"></div><div class="rotation-contact-stack"><input class="rotation-detail-input" data-path="coordinator.name" placeholder="Course coordinator" value="${esc(d.coordinator?.name||'')}"><input class="rotation-detail-input" data-path="coordinator.email" placeholder="Coordinator email" value="${esc(d.coordinator?.email||'')}"><input class="rotation-detail-input" data-path="coordinator.phone" placeholder="Coordinator phone" value="${esc(d.coordinator?.phone||'')}"></div></div></div><div><div class="rotation-detail-label">Assignments</div><textarea class="rotation-detail-area" data-path="assignments" placeholder="One assignment per line">${esc(d.assignments)}</textarea></div><div><div class="rotation-detail-label">Helpful Resources</div><textarea class="rotation-detail-area" data-path="resources" placeholder="Resource titles / links">${esc(d.resources)}</textarea></div><div><div class="rotation-detail-label">Concepts to Review</div><textarea class="rotation-detail-area" data-path="concepts">${esc(d.concepts)}</textarea></div><div><div class="rotation-detail-label">Notes</div><textarea class="rotation-detail-area" data-path="notes">${esc(d.notes)}</textarea></div><div class="rotation-detail-span"><div class="rotation-detail-label">Meaningful Encounters</div><textarea class="rotation-detail-area" data-path="encounters" placeholder="Brief note · attending">${esc(d.encounters)}</textarea><div class="rotation-detail-help">Saved automatically for this rotation.</div></div></div></div>`;a.querySelector('button').onclick=()=>a.classList.toggle('open');a.querySelectorAll('[data-path]').forEach(el=>el.addEventListener('input',()=>{setPath(detailStore[r.id],el.dataset.path,el.value);saveDetails(detailStore)}));return a}
  function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function setPath(obj,path,value){const p=path.split('.');let x=obj;while(p.length>1){const k=p.shift();x[k]=x[k]||{};x=x[k]}x[p[0]]=value}
  function renderLifecycleLists(){const ix=currentIndex(),up=doc.getElementById('upcoming'),past=doc.getElementById('past');if(!up||!past)return;up.innerHTML='';past.innerHTML='';rotationDefinitions.forEach((r,i)=>{if(i<ix)past.appendChild(detailCard(r));else if(i>ix)up.appendChild(detailCard(r))});const current=rotationDefinitions[ix];if(current)applyCurrentRotation(current);}
  function applyCurrentRotation(r){const d=detailStore[r.id]||blankDetails(r),title=doc.getElementById('rotationName'),dates=doc.getElementById('rotationDates'),loc=doc.getElementById('rotationLocation');if(title)title.textContent=r.name;if(dates)dates.textContent=fmtRange(r);if(loc)loc.textContent=d.location||'';const ids={gassName:d.director?.name||'',gassEmail:d.director?.email||'',alexisName:d.coordinator?.name||'',alexisEmail:d.coordinator?.email||'',alexisPhone:d.coordinator?.phone||''};Object.entries(ids).forEach(([id,v])=>{const el=doc.getElementById(id);if(el)el.textContent=v});}
  renderLifecycleLists();
  const nextMidnight=()=>{const n=new Date();n.setHours(24,0,1,0);return n-Date.now()};
  setTimeout(function rollover(){renderLifecycleLists();setTimeout(rollover,nextMidnight())},nextMidnight());

  const notesBox=doc.getElementById('notes');if(notesBox){notesBox.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&['b','i','u'].includes(e.key.toLowerCase())){e.preventDefault();doc.execCommand({b:'bold',i:'italic',u:'underline'}[e.key.toLowerCase()],false,null);notesBox.dispatchEvent(new Event('input',{bubbles:true}))}})}
  const fixFeedbackLink=()=>{[...doc.querySelectorAll('#assignments .row')].forEach(row=>{const input=row.querySelector('input[type="text"]');if(input&&input.value.trim()==='Mid-Rotation Feedback Form'){input.style.cursor='pointer';input.title='Click to open Mid-Rotation Feedback Form';input.onclick=e=>{e.preventDefault();e.stopPropagation();window.open('MS4%20-%20Common%20Mid-Rotation%20Feedback%20Form%20%281%29.pdf','_blank')}}})};fixFeedbackLink();setTimeout(fixFeedbackLink,300);
});

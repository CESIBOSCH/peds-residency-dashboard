<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>4th Year Schedule | Fourth Year</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#FAF9F5}
iframe{display:block;width:100%;height:100%;border:0;background:#FAF9F5}
</style>
</head>
<body>
<iframe id="scheduleFrame" src="schedule-base.html" title="4th Year Schedule"></iframe>
<script>
const frame=document.getElementById('scheduleFrame');
frame.addEventListener('load',()=>{
  const doc=frame.contentDocument;
  if(!doc)return;

  const style=doc.createElement('style');
  style.textContent=`
    /* Stable layout layer for Current Rotation */
    .grid:not(.expanded){grid-template-columns:420px minmax(0,1fr)!important;gap:26px!important}
    .rotation{position:relative!important;padding:21px 23px!important}
    .rotation-title{font-size:22px!important;line-height:1.28!important}
    .rotation-dates{font-size:13px!important;line-height:1.45!important}
    .expand{width:auto!important;min-width:0!important;height:30px!important;padding:0 11px!important;border:1px solid var(--border)!important;border-radius:7px!important;background:#fff!important;color:var(--muted)!important;font-size:11px!important;font-weight:500!important;line-height:28px!important;box-shadow:none!important}
    .rotation .label,.rotation .priority-panel>.label,.rotation .notes-priority>.label,.rotation .encounters-secondary>.label{color:var(--sage)!important;font-size:11.5px!important;font-weight:600!important;letter-spacing:.14em!important;text-transform:uppercase!important}
    .rotation-reference{display:none!important}
    .rotation-assignments{margin-top:23px!important;padding-top:0!important;border:0!important}
    .priority-panel,.notes-priority,.encounters-secondary{border:0!important}
    .priority-grid{display:block!important}
    .priority-panel{margin-top:24px!important}
    .priority-panel+.priority-panel{margin-top:25px!important}
    .notes-priority{margin-top:27px!important}
    .encounters-secondary{margin-top:27px!important;padding-top:0!important}
    .notes-tools{display:none!important}
    .notes{margin-top:9px!important;min-height:155px!important;font-size:13px!important;line-height:1.5!important}
    .row{grid-template-columns:18px minmax(0,1fr) 18px!important;gap:8px!important}
    .row input[type=text],.resource-item a{font-size:12.5px!important;line-height:1.4!important}
    .add{font-size:11.5px!important;margin-top:8px!important}
    .rotation hr{display:none!important}
    #editSyllabus,.reference-syllabus,.syllabus{display:none!important}

    .rotation-header-wrap{margin:0!important;padding:0!important;border:0!important}
    .rotation-header-meta{margin-top:14px!important;padding:0!important;border:0!important}
    .rotation-header-meta .editable{margin:0!important;padding:0!important;font-size:12.5px!important;font-weight:500!important}
    .rotation-header-contacts{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:18px!important;margin-top:14px!important}
    .rotation-header-contacts .contact{display:flex!important;flex-direction:column!important;align-items:flex-start!important;min-width:0!important;margin:0!important;padding:0!important}
    .rotation-header-contacts .role{font-size:9px!important;margin:0 0 4px!important;padding:0!important}
    .rotation-header-contacts .name{font-size:12px!important;margin:0 0 3px!important;padding:0!important}
    .rotation-header-contacts a{display:block!important;margin:0!important;padding:0!important;font-size:11px!important;line-height:1.28!important;text-decoration:none!important}
    .rotation-header-contacts br{display:none!important}
    .rotation-header-contacts #alexisPhone{margin:1px 0 0!important;padding:0!important;line-height:1.18!important}

    .grid.expanded{grid-template-columns:minmax(0,1fr) 300px!important;gap:24px!important;align-items:start!important}
    .grid.expanded .rotation{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,.9fr)!important;column-gap:42px!important;row-gap:0!important;padding:30px 30px 32px!important}
    .grid.expanded .rotation-header-wrap{grid-column:1/-1!important;display:grid!important;grid-template-columns:minmax(390px,1.12fr) minmax(520px,1fr)!important;column-gap:44px!important;align-items:start!important;position:relative!important;margin:0 0 26px!important;padding:0!important;border:0!important}
    .grid.expanded .rotation-head{grid-column:1!important;grid-row:1!important;display:block!important;margin:0!important;padding:0!important;border:0!important;box-shadow:none!important;text-align:left!important}
    .grid.expanded .rotation-head>div{margin:0!important;padding:0!important;text-align:left!important}
    .grid.expanded .rotation-head .label,.grid.expanded .rotation-title,.grid.expanded .rotation-dates{margin-left:0!important;padding-left:0!important;text-align:left!important}
    .grid.expanded .rotation-title{margin-top:10px!important;font-size:24px!important;line-height:1.22!important}
    .grid.expanded .rotation-dates{margin:12px 0 0!important;padding:0!important;border:0!important;background:transparent!important;box-shadow:none!important;font-size:13px!important}
    .grid.expanded .rotation-head .expand{position:absolute!important;top:0!important;right:0!important;z-index:3!important}
    .grid.expanded .rotation-header-meta{grid-column:1!important;grid-row:2!important;margin-top:12px!important;padding:0!important;border:0!important}
    .grid.expanded .rotation-header-meta .editable{margin:0!important;padding:0!important;border:0!important;background:transparent!important;box-shadow:none!important;font-size:13px!important;font-weight:500!important;white-space:nowrap!important;text-align:left!important}
    .grid.expanded .rotation-header-contacts{grid-column:2!important;grid-row:1 / span 2!important;display:grid!important;grid-template-columns:minmax(245px,1fr) minmax(275px,1.08fr)!important;gap:30px!important;min-width:0!important;margin:4px 108px 0 0!important;padding:0!important;align-self:start!important}
    .grid.expanded .rotation-header-contacts .contact{display:flex!important;flex-direction:column!important;align-items:flex-start!important;gap:0!important;min-width:0!important;margin:0!important;padding:0!important}
    .grid.expanded .rotation-header-contacts .role{margin:0 0 7px!important;padding:0!important;font-size:9px!important;white-space:nowrap!important}
    .grid.expanded .rotation-header-contacts .name{margin:0 0 4px!important;padding:0!important;font-size:12.5px!important;line-height:1.28!important;white-space:nowrap!important}
    .grid.expanded .rotation-header-contacts a{margin:0!important;padding:0!important;font-size:11px!important;line-height:1.24!important;white-space:nowrap!important;overflow:visible!important;max-width:none!important;word-break:normal!important;overflow-wrap:normal!important}
    .grid.expanded .rotation-header-contacts #alexisPhone{margin:1px 0 0!important;padding:0!important;line-height:1.15!important;white-space:nowrap!important}
    .grid.expanded .rotation-assignments{grid-column:1!important;grid-row:2!important;margin:0!important;padding:0!important;border:0!important}
    .grid.expanded .priority-grid{display:contents!important}
    .grid.expanded .resources-panel{grid-column:2!important;grid-row:2!important;margin:0!important;padding:0!important;border:0!important}
    .grid.expanded .concepts-panel{grid-column:1!important;grid-row:3!important;margin:30px 0 0!important}
    .grid.expanded .notes-priority{grid-column:2!important;grid-row:3!important;margin:30px 0 0!important}
    .grid.expanded .notes{min-height:190px!important;margin-top:10px!important}
    .grid.expanded .encounters-secondary{grid-column:1/-1!important;grid-row:4!important;margin:30px 0 0!important;padding:0!important;border:0!important}
  `;
  doc.head.appendChild(style);

  const rotation=doc.querySelector('.rotation');
  const head=rotation?.querySelector('.rotation-head');
  const reference=rotation?.querySelector('.rotation-reference');
  const assignments=rotation?.querySelector('.rotation-assignments');
  const priorityGrid=rotation?.querySelector('.priority-grid');
  const notes=rotation?.querySelector('.notes-priority');
  const encounters=rotation?.querySelector('.encounters-secondary');

  if(rotation&&head&&reference&&assignments&&priorityGrid&&notes&&encounters){
    const panels=[...priorityGrid.querySelectorAll('.priority-panel')];
    const concepts=panels.find(p=>p.textContent.includes('Concepts to Review'));
    const resources=panels.find(p=>p.textContent.includes('Helpful Resources'));
    if(concepts) concepts.classList.add('concepts-panel');
    if(resources) resources.classList.add('resources-panel');

    let headerWrap=rotation.querySelector('.rotation-header-wrap');
    if(!headerWrap){
      headerWrap=doc.createElement('div');
      headerWrap.className='rotation-header-wrap';
      rotation.insertBefore(headerWrap,head);
      headerWrap.appendChild(head);
    }

    let meta=headerWrap.querySelector('.rotation-header-meta');
    const location=reference.querySelector('.reference-location #rotationLocation');
    if(!meta){meta=doc.createElement('div');meta.className='rotation-header-meta';headerWrap.appendChild(meta)}
    if(location&&!meta.contains(location)) meta.appendChild(location);

    let contactsWrap=headerWrap.querySelector('.rotation-header-contacts');
    const sourceContacts=reference.querySelector('.reference-contacts');
    if(!contactsWrap){contactsWrap=doc.createElement('div');contactsWrap.className='rotation-header-contacts';headerWrap.appendChild(contactsWrap)}
    if(sourceContacts){
      [...sourceContacts.querySelectorAll('.contact')].forEach(contact=>{
        [...contact.querySelectorAll('br')].forEach(br=>br.remove());
        contactsWrap.appendChild(contact);
      });
    }

    const syllabus=reference.querySelector('.reference-syllabus,.syllabus');
    if(syllabus) syllabus.remove();

    rotation.insertBefore(assignments,headerWrap.nextSibling);
    priorityGrid.innerHTML='';
    if(resources) priorityGrid.appendChild(resources);
    if(concepts) priorityGrid.appendChild(concepts);
    rotation.insertBefore(priorityGrid,assignments.nextSibling);
    rotation.insertBefore(notes,priorityGrid.nextSibling);
    rotation.insertBefore(encounters,notes.nextSibling);
  }

  const notesBox=doc.getElementById('notes');
  if(notesBox){notesBox.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&['b','i','u'].includes(e.key.toLowerCase())){e.preventDefault();doc.execCommand({b:'bold',i:'italic',u:'underline'}[e.key.toLowerCase()],false,null);notesBox.dispatchEvent(new Event('input',{bubbles:true}));}})}

  const fixFeedbackLink=()=>{[...doc.querySelectorAll('#assignments .row')].forEach(row=>{const input=row.querySelector('input[type="text"]');if(input&&input.value.trim()==='Mid-Rotation Feedback Form'){input.style.cursor='pointer';input.title='Click to open Mid-Rotation Feedback Form';input.onclick=e=>{e.preventDefault();e.stopPropagation();window.open('MS4%20-%20Common%20Mid-Rotation%20Feedback%20Form%20%281%29.pdf','_blank')}}})};
  fixFeedbackLink();setTimeout(fixFeedbackLink,300);
});
</script>
</body>
</html>

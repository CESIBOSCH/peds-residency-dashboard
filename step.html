<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step & Study | Fourth Year</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --bg-app: #FAF9F5;
      --bg-surface: #FFFFFF;
      --text-charcoal: #2D3132;
      --text-gray: #6B7280;
      --accent-terracotta: #C86D51;
      --accent-sage: #8E9B88;
      --border-light: #E5E0D8;
    }

    body {
      margin: 0;
      background: var(--bg-app);
      color: var(--text-charcoal);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .menu-panel {
      transform: translateX(-110%);
      transition: transform 0.25s ease;
    }

    .menu-panel.open {
      transform: translateX(0);
    }

    .menu-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .menu-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>

<body>

  <!-- Top Navigation -->
  <header class="h-20 bg-white border-b border-[#E5E0D8] flex items-center justify-between px-8 relative z-30">

    <button
      id="menuButton"
      class="text-3xl text-[#2D3132] hover:text-[#C86D51] transition"
      aria-label="Open menu"
    >
      ☰
    </button>

    <div class="absolute left-1/2 -translate-x-1/2 text-xl md:text-2xl tracking-[0.22em] text-[#8E9B88] font-medium">
      FOURTH YEAR
    </div>

    <div class="w-8"></div>

  </header>

  <!-- Dark overlay behind menu -->
  <div
    id="menuOverlay"
    class="menu-overlay fixed inset-0 bg-black/20 z-40"
  ></div>

  <!-- Hamburger Menu -->
  <aside
    id="menuPanel"
    class="menu-panel fixed top-0 left-0 h-full w-72 bg-white border-r border-[#E5E0D8] shadow-xl z-50"
  >

    <div class="h-20 flex items-center justify-between px-6 border-b border-[#E5E0D8]">

      <span class="tracking-[0.18em] text-sm text-[#8E9B88] font-semibold">
        FOURTH YEAR
      </span>

      <button
        id="closeMenuButton"
        class="text-2xl text-[#6B7280] hover:text-[#C86D51]"
        aria-label="Close menu"
      >
        ×
      </button>

    </div>

    <nav class="p-4 space-y-1">

      <a
        href="index.html"
        class="block px-4 py-3 rounded-lg hover:bg-[#FAF9F5]"
      >
        Home
      </a>

      <a
        href="step.html"
        class="block px-4 py-3 rounded-lg bg-[#FBF4F1] text-[#C86D51] font-medium"
      >
        Step & Study
      </a>

      <a
        href="programs.html"
        class="block px-4 py-3 rounded-lg hover:bg-[#FAF9F5]"
      >
        Program Explorer
      </a>

      <a
        href="resources.html"
        class="block px-4 py-3 rounded-lg hover:bg-[#FAF9F5]"
      >
        Program Research
      </a>

      <a
        href="application.html"
        class="block px-4 py-3 rounded-lg hover:bg-[#FAF9F5]"
      >
        Application Tracker
      </a>

      <a
        href="schedule.html"
        class="block px-4 py-3 rounded-lg hover:bg-[#FAF9F5]"
      >
        4th Year Schedule
      </a>

    </nav>

  </aside>

  <!-- Page Content -->
  <main class="max-w-6xl mx-auto px-6 py-12">

    <div class="mb-10">
      <div class="text-xs font-semibold tracking-[0.16em] text-[#8E9B88] uppercase mb-3">
        Step & Study
      </div>

      <h1 class="text-4xl md:text-5xl font-serif text-[#4F675E]">
        Step & Study
      </h1>
    </div>

    <!-- Placeholder content -->
    <section class="bg-white border border-[#E5E0D8] rounded-xl p-8">

      <p class="text-[#6B7280]">
        This page will hold your Step resources, tutoring links,
        registration information, Anki links, and frequently used study tools.
      </p>

    </section>

  </main>

  <script>
    const menuButton = document.getElementById('menuButton');
    const closeMenuButton = document.getElementById('closeMenuButton');
    const menuPanel = document.getElementById('menuPanel');
    const menuOverlay = document.getElementById('menuOverlay');

    function openMenu() {
      menuPanel.classList.add('open');
      menuOverlay.classList.add('open');
    }

    function closeMenu() {
      menuPanel.classList.remove('open');
      menuOverlay.classList.remove('open');
    }

    menuButton.addEventListener('click', openMenu);
    closeMenuButton.addEventListener('click', closeMenu);
    menuOverlay.addEventListener('click', closeMenu);
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pediatric Residency Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        #map { height: 500px; width: 100%; border-radius: 0.75rem; }
    </style>
</head>
<body class="bg-[#FAF8F5] text-[#2D2825] antialiased min-h-screen flex flex-col">

    <!-- Centered Minimalist Header -->
    <header class="py-10 text-center">
        <h1 class="text-3xl font-light tracking-wide text-[#2D2825]">Pediatric Residency Tracker</h1>
        <p class="text-xs text-[#8C827B] mt-1 tracking-widest uppercase">Clinical Volume, Autonomy & Fit Evaluation</p>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-16 flex-grow w-full space-y-8">

        <!-- Controls & Map Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <!-- Sidebar Filters -->
            <div class="bg-[#F4EFEA] p-6 rounded-xl border border-[#EBE4DC] shadow-sm flex flex-col justify-between space-y-6">
                <div class="space-y-4">
                    <h2 class="text-xs font-semibold text-[#5A524C] tracking-wider uppercase">Filters</h2>
                    
                    <!-- Search Bar -->
                    <div>
                        <label class="block text-[11px] font-medium text-[#736A63] mb-1">Search Program</label>
                        <input type="text" id="searchInput" oninput="filterPrograms()" placeholder="Name or city..." class="w-full text-xs bg-white border border-[#EBE4DC] rounded-lg px-3 py-2 text-[#2D2825] focus:outline-none focus:ring-1 focus:ring-[#8C827B]">
                    </div>

                    <!-- Region Filter -->
                    <div>
                        <label class="block text-[11px] font-medium text-[#736A63] mb-1">Region</label>
                        <select id="regionFilter" onchange="filterPrograms()" class="w-full text-xs bg-white border border-[#EBE4DC] rounded-lg px-3 py-2 text-[#2D2825] focus:outline-none focus:ring-1 focus:ring-[#8C827B]">
                            <option value="">All Regions</option>
                            <option value="Northeast">Northeast</option>
                            <option value="Southeast">Southeast</option>
                            <option value="Midwest">Midwest</option>
                            <option value="West">West</option>
                        </select>
                    </div>

                    <!-- Focus Filter -->
                    <div>
                        <label class="block text-[11px] font-medium text-[#736A63] mb-1">Profile Focus</label>
                        <select id="focusFilter" onchange="filterPrograms()" class="w-full text-xs bg-white border border-[#EBE4DC] rounded-lg px-3 py-2 text-[#2D2825] focus:outline-none focus:ring-1 focus:ring-[#8C827B]">
                            <option value="">All Profiles</option>
                            <option value="High Autonomy">High Autonomy</option>
                            <option value="Heavy Clinical">Heavy Clinical</option>
                            <option value="Balanced">Balanced</option>
                        </select>
                    </div>
                </div>

                <button onclick="resetFilters()" class="w-full text-xs bg-[#EBE4DC] hover:bg-[#DFD7CE] text-[#5A524C] py-2 rounded-lg font-medium transition-colors">Reset Filters</button>
            </div>

            <!-- Map View -->
            <div class="lg:col-span-3 bg-white p-4 rounded-xl border border-[#EBE4DC] shadow-sm flex flex-col">
                <div id="map" class="flex-grow"></div>
            </div>
        </div>

        <!-- Programs Grid -->
        <div class="bg-white rounded-xl border border-[#EBE4DC] shadow-sm overflow-hidden p-6">
            <div class="mb-6 flex items-center justify-between">
                <h3 class="text-xs font-bold text-[#5A524C] uppercase tracking-wider">Matched Programs</h3>
                <span class="text-xs text-[#8C827B]" id="programCountText"></span>
            </div>
            <div id="programTable" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Dynamic cards injected via JS -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-6 text-center text-xs text-[#8C827B] border-t border-[#EBE4DC]">
        Pediatric Residency Application Tracker
    </footer>

    <!-- Script Data & Logic -->
    <script>
        const programs = [
            {
                id: 1,
                name: "Boston Children's Hospital / Harvard",
                location: "Boston, MA",
                region: "Northeast",
                lat: 42.3378,
                lng: -71.1054,
                volume: "Very High",
                autonomy: "Moderate",
                focus: "Heavy Clinical",
                notes: "World-class pediatric training with extensive subspecialty exposure."
            },
            {
                id: 2,
                name: "Children's Hospital of Philadelphia (CHOP)",
                location: "Philadelphia, PA",
                region: "Northeast",
                lat: 39.9484,
                lng: -75.1920,
                volume: "Very High",
                autonomy: "Moderate",
                focus: "Heavy Clinical",
                notes: "Premier academic center, massive patient volume and complex care."
            },
            {
                id: 3,
                name: "Atrium Health Carolinas Medical Center",
                location: "Charlotte, NC",
                region: "Southeast",
                lat: 35.2144,
                lng: -80.8385,
                volume: "High",
                autonomy: "High",
                focus: "Balanced",
                notes: "Excellent autonomy, balanced lifestyle, strong community and tertiary care mix."
            },
            {
                id: 4,
                name: "Seattle Children's Hospital / University of Washington",
                location: "Seattle, WA",
                region: "West",
                lat: 47.6663,
                lng: -122.3054,
                volume: "High",
                autonomy: "High",
                focus: "High Autonomy",
                notes: "Fantastic coastal location, strong advocacy, excellent resident culture."
            }
        ];

        const map = L.map('map').setView([38.5, -92.5], 4);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let markers = [];

        function renderMapMarkers(data) {
            markers.forEach(m => map.removeLayer(m));
            markers = [];

            data.forEach(p => {
                const marker = L.marker([p.lat, p.lng]).addTo(map);
                marker.bindPopup(`
                    <div style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12px; color: #2D2825;">
                        <strong>${p.name}</strong><br>
                        <span style="color: #8C827B;">${p.location}</span><br>
                        <hr style="margin: 4px 0; border: none; border-top: 1px solid #EBE4DC;">
                        <b>Autonomy:</b> ${p.autonomy}<br>
                        <b>Volume:</b> ${p.volume}
                    </div>
                `);
                markers.push(marker);
            });
        }

        function renderTable(data) {
            const container = document.getElementById('programTable');
            document.getElementById('programCountText').innerText = `${data.length} listed`;
            
            if (data.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-[#8C827B] text-xs">No programs match the selected filters.</div>`;
                return;
            }

            container.innerHTML = data.map(p => `
                <div class="bg-[#FAF8F5] border border-[#EBE4DC] rounded-xl p-5 hover:border-[#8C827B] transition-all shadow-sm flex flex-col justify-between space-y-4">
                    <div>
                        <div class="flex items-start justify-between gap-2 mb-2">
                            <h4 class="font-medium text-[#2D2825] text-xs leading-snug">${p.name}</h4>
                            <span class="text-[10px] bg-[#EBE4DC] text-[#5A524C] px-2 py-0.5 rounded-full whitespace-nowrap">${p.region}</span>
                        </div>
                        <p class="text-[11px] text-[#8C827B] mb-3">${p.location}</p>
                        <p class="text-[11px] text-[#5A524C] bg-white p-2.5 rounded-lg border border-[#EBE4DC]">${p.notes}</p>
                    </div>
                    
                    <div class="pt-3 border-t border-[#EBE4DC] flex items-center justify-between text-[11px]">
                        <div>
                            <span class="text-[#8C827B] block text-[9px] uppercase tracking-wider">Autonomy</span>
                            <span class="font-medium text-[#2D2825]">${p.autonomy}</span>
                        </div>
                        <div>
                            <span class="text-[#8C827B] block text-[9px] uppercase tracking-wider">Volume</span>
                            <span class="font-medium text-[#2D2825]">${p.volume}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterPrograms() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const region = document.getElementById('regionFilter').value;
            const focus = document.getElementById('focusFilter').value;

            const filtered = programs.filter(p => {
                const matchesQuery = p.name.toLowerCase().includes(query) || p.location.toLowerCase().includes(query);
                const matchesRegion = !region || p.region === region;
                const matchesFocus = !focus || p.focus === focus;
                return matchesQuery && matchesRegion && matchesFocus;
            });

            renderTable(filtered);
            renderMapMarkers(filtered);
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('regionFilter').value = '';
            document.getElementById('focusFilter').value = '';
            filterPrograms();
        }

        renderTable(programs);
        renderMapMarkers(programs);
    </script>
</body>
</html>

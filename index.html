<script>
  let allPrograms = [];
  let selectedFilters = { state: new Set(), setting: new Set(), competitiveness: new Set() };
  let map;
  let markersMap = new Map();

  // Airport Lookup Table
  const airportLookup = {
    "Ann Arbor, MI": "DTW",
    "Sacramento, CA": "SMF",
    "Charlotte, NC": "CLT",
    "Phoenix, AZ": "PHX", 
    "Los Angeles, CA": "LAX", 
    "San Francisco, CA": "SFO",
    "Oakland, CA": "OAK", 
    "San Diego, CA": "SAN",
    "New Haven, CT": "BDL", 
    "Denver, CO": "DEN", 
    "Washington, DC": "DCA",
    "Chicago, IL": "ORD", 
    "Boston, MA": "BOS", 
    "Baltimore, MD": "BWI",
    "Minneapolis, MN": "MSP", 
    "St. Louis, MO": "STL",
    "Chapel Hill, NC": "RDU", 
    "Philadelphia, PA": "PHL",
    "Pittsburgh, PA": "PIT", 
    "Seattle, WA": "SEA", 
    "New York, NY": "JFK",
    "Houston, TX": "IAH", 
    "Dallas, TX": "DFW", 
    "Atlanta, GA": "ATL"
  };

  // Helper: Strip special characters & lowercase for soft key matching
  function cleanKey(str) {
    return String(str || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  }

  // Enhanced Property Extractor (Handles varied column headers safely)
  function getProp(obj, possibleKeys, defaultVal = 'N/A') {
    if (!obj || typeof obj !== 'object') return defaultVal;
    const objKeys = Object.keys(obj);

    // Exact clean match
    for (const keyCandidate of possibleKeys) {
      const targetClean = cleanKey(keyCandidate);
      const matchedKey = objKeys.find(k => cleanKey(k) === targetClean);
      if (matchedKey && obj[matchedKey] !== undefined && obj[matchedKey] !== null) {
        const val = String(obj[matchedKey]).trim();
        if (val !== '' && val !== '-') return val;
      }
    }

    // Partial key match
    for (const keyCandidate of possibleKeys) {
      const targetClean = cleanKey(keyCandidate);
      const matchedKey = objKeys.find(k => cleanKey(k).includes(targetClean));
      if (matchedKey && obj[matchedKey] !== undefined && obj[matchedKey] !== null) {
        const val = String(obj[matchedKey]).trim();
        if (val !== '' && val !== '-') return val;
      }
    }

    return defaultVal;
  }

  function formatCurrency(val) {
    if (!val || val === 'N/A') return 'N/A';
    const cleanNum = parseFloat(String(val).replace(/[^0-9.-]+/g, ""));
    if (isNaN(cleanNum)) return val;
    return '$' + cleanNum.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
  }

  function isTrueValue(val) {
    if (!val || val === 'N/A') return false;
    const cleanVal = String(val).trim().toLowerCase();
    return ['yes', 'true', '1', 'x', 'y'].includes(cleanVal);
  }

  function cleanSettingName(val) {
    if (!val || val === 'N/A') return 'N/A';
    let cleaned = val.trim();
    if (cleaned.toLowerCase().includes("university affiliated") || cleaned.toLowerCase().includes("cb/university")) {
      return "Community-Based Univ. Affiliated";
    }
    return cleaned;
  }

  // Generate HTML Face Sheet
  function createFactSheetHTML(prog) {
    const city = getProp(prog, ['City', 'Location City', 'Town']);
    const state = getProp(prog, ['State', 'Location State', 'ST']);
    const cityStateKey = `${city}, ${state}`;

    const rawWebsite = getProp(prog, ['Website', 'URL', 'Program Website', 'Link'], '#');
    const programName = getProp(prog, ['Program', 'Program Name', 'Hospital', 'Institution', 'Name'], 'Program Info');

    // Airport resolution
    let airport = getProp(prog, ['Nearest Airport', 'Airport', 'Airport Code']);
    if (airport === 'N/A') {
      airport = airportLookup[cityStateKey] || (city !== 'N/A' ? city.substring(0, 3).toUpperCase() : 'N/A');
    }

    // Extract stats safely
    const classSize = getProp(prog, ['Class size', 'Class Size', 'Size', 'Program Size']);
    const setting = cleanSettingName(getProp(prog, ['Setting', 'Program Setting', 'Hospital Setting']));
    const tier = getProp(prog, ['Competitiveness', 'Tier', 'Category', 'Target/Reach', 'Reach/Target']);
    const stepScore = getProp(prog, ['Step Score Range', 'Step Score', 'Step 2 Target', 'Target Step']);

    const avgHours = getProp(prog, ['Average Hours Worked', 'Work Hours', 'Average Hours', 'Hours/Week']);
    const shiftLength = getProp(prog, ['Longest Shift Length', 'Shift Length', 'Max Shift Length', 'Longest Shift']);
    const daysOff = getProp(prog, ['Days Off Per Week', 'Days Off/Week', 'Days Off']);
    const sickDays = getProp(prog, ['Sick Days', 'Sick Leave Days', 'Sick Leave']);
    const vacationDays = getProp(prog, ['Vacation Days', 'Vacation', 'PTO']);

    // Family Leave extraction
    let paidLeave = getProp(prog, ['Paid Family Leave Days', 'Paid Family Leave', 'Paid Leave']);
    let unpaidLeave = getProp(prog, ['Unpaid Family Leave Days', 'Unpaid Family Leave', 'Unpaid Leave']);

    const baseSalary = formatCurrency(getProp(prog, ['Salary', 'Base Salary', 'PGY1 Salary', 'PGY-1 Salary']));
    const colSalary = formatCurrency(getProp(prog, ['COL Adjusted Salary', 'COL-Adjusted Salary', 'Adjusted Salary']));
    const stretchScore = getProp(prog, ['Salary Stretch Score', 'Stretch Score', 'Salary Score']);

    const formattedWebsite = rawWebsite !== '#' ? (rawWebsite.startsWith('http') ? rawWebsite : 'https://' + rawWebsite) : '#';

    return `
      <div class="p-3.5 space-y-2.5 font-sans max-h-[420px] overflow-y-auto bg-white">
        
        <div class="border-b border-[#E5E0D8] pb-1.5">
          <h3 class="font-semibold text-xs text-[#2D3132] leading-tight">
            ${formattedWebsite !== '#' ? `<a href="${formattedWebsite}" target="_blank" rel="noopener noreferrer" class="text-[#2D3132] hover:text-[#C86D51] hover:underline flex items-center gap-1">${programName} <span class="text-[9px] text-[#C86D51]">↗</span></a>` : programName}
          </h3>
        </div>

        <!-- BASICS -->
        <div class="space-y-1">
          <span class="text-[9px] font-semibold uppercase tracking-wider text-[#6B7280]">Basics</span>
          <div class="grid grid-cols-2 gap-1.5 text-[10px]">
            <div class="bg-[#FAF9F5] p-1.5 rounded border border-[#E5E0D8]">
              <span class="text-[#6B7280] block text-[8px] uppercase font-medium">Location</span>
              <span class="font-medium text-[#2D3132] truncate block">${city}, ${state}</span>
            </div>
            <div class="bg-[#FAF9F5] p-1.5 rounded border border-[#E5E0D8]">
              <span class="text-[#6B7280] block text-[8px] uppercase font-medium">Nearest Airport</span>
              <span class="font-medium text-[#2D3132] truncate block">${airport}</span>
            </div>
          </div>
          <div class="grid grid-cols-4 gap-1.5 text-[10px]">
            <div class="col-span-3 bg-[#FAF9F5] p-1.5 rounded border border-[#E5E0D8]">
              <span class="text-[#6B7280] block text-[8px] uppercase font-medium">Setting</span>
              <span class="font-medium text-[#2D3132] block truncate">${setting}</span>
            </div>
            <div class="col-span-1 bg-[#FAF9F5] p-1.5 rounded border border-[#E5E0D8] text-center">
              <span class="text-[#6B7280] block text-[8px] uppercase font-medium">Class Size</span>
              <span class="font-medium text-[#2D3132]">${classSize}</span>
            </div>
          </div>
        </div>

        <!-- APPLICATION -->
        <div class="space-y-1">
          <span class="text-[9px] font-semibold uppercase tracking-wider text-[#6B7280]">Application</span>
          <div class="grid grid-cols-2 gap-1.5 text-[10px]">
            <div class="bg-[#FAF9F5] p-1.5 rounded border border-[#E5E0D8]">
              <span class="text-[#6B7280] block text-[8px] uppercase font-medium">Tier / Category</span>
              <span class="font-medium text-[#2D3132]">${tier}</span>
            </div>
            <div class="bg-[#FAF9F5] p-1.5 rounded border border-[#E5E0D8]">
              <span class="text-[#6B7280] block text-[8px] uppercase font-medium">Step Score Target</span>
              <span class="font-medium text-[#2D3132]">${stepScore}</span>
            </div>
          </div>
        </div>

        <!-- WORK & LEAVE -->
        <div class="space-y-1">
          <span class="text-[9px] font-semibold uppercase tracking-wider text-[#6B7280]">Work & Leave</span>
          <div class="bg-[#FAF9F5] p-2 rounded border border-[#E5E0D8] text-[10px] space-y-1">
            <div class="flex justify-between">
              <span class="text-[#6B7280]">Average Hours/Week:</span>
              <span class="font-medium text-[#2D3132]">${avgHours}</span>
            </div>
            <div class="flex justify-between border-t border-[#E5E0D8]/60 pt-1">
              <span class="text-[#6B7280]">Longest Shift Length:</span>
              <span class="font-medium text-[#2D3132]">${shiftLength}</span>
            </div>
            <div class="flex justify-between border-t border-[#E5E0D8]/60 pt-1">
              <span class="text-[#6B7280]">Days Off/Week:</span>
              <span class="font-medium text-[#2D3132]">${daysOff}</span>
            </div>
            <div class="flex justify-between border-t border-[#E5E0D8]/60 pt-1">
              <span class="text-[#6B7280]">Sick Days:</span>
              <span class="font-medium text-[#2D3132]">${sickDays}</span>
            </div>
            <div class="flex justify-between border-t border-[#E5E0D8]/60 pt-1">
              <span class="text-[#6B7280]">Vacation Days:</span>
              <span class="font-medium text-[#2D3132]">${vacationDays}</span>
            </div>
            <div class="flex justify-between border-t border-[#E5E0D8]/60 pt-1">
              <span class="text-[#6B7280]">Family Leave (Paid / Unpaid):</span>
              <span class="font-medium text-[#2D3132]">${paidLeave} / ${unpaidLeave}</span>
            </div>
          </div>
        </div>

        <!-- COMPENSATION -->
        <div class="space-y-1">
          <span class="text-[9px] font-semibold uppercase tracking-wider text-[#6B7280]">Compensation</span>
          <div class="grid grid-cols-3 gap-1 text-[9px]">
            <div class="bg-[#FAF9F5] p-1.5 rounded border border-[#E5E0D8] text-center">
              <span class="text-[#6B7280] block text-[7px] uppercase font-medium">Base Salary</span>
              <span class="font-medium text-[#2D3132]">${baseSalary}</span>
            </div>
            <div class="bg-[#FAF9F5] p-1.5 rounded border border-[#E5E0D8] text-center">
              <span class="text-[#6B7280] block text-[7px] uppercase font-medium truncate">COL-Adjusted Salary</span>
              <span class="font-medium text-[#2D3132]">${colSalary}</span>
            </div>
            <div class="bg-[#FAF9F5] p-1.5 rounded border border-[#E5E0D8] text-center">
              <span class="text-[#6B7280] block text-[7px] uppercase font-medium truncate">Stretch Score</span>
              <span class="font-medium text-[#2D3132]">${stretchScore}</span>
            </div>
          </div>
        </div>

      </div>
    `;
  }

  function renderMapMarkers(data) {
    if (!map) return;

    // Clear existing markers
    markersMap.forEach(marker => map.removeLayer(marker));
    markersMap.clear();

    data.forEach(prog => {
      const lat = parseFloat(getProp(prog, ['Latitude', 'Lat']));
      const lng = parseFloat(getProp(prog, ['Longitude', 'Lng', 'Long']));

      if (!isNaN(lat) && !isNaN(lng)) {
        const marker = L.circleMarker([lat, lng], {
          radius: 7,
          fillColor: "#C86D51",
          color: "#FFFFFF",
          weight: 1.5,
          opacity: 1,
          fillOpacity: 0.9
        }).addTo(map);

        const factSheetHTML = createFactSheetHTML(prog);
        marker.bindPopup(factSheetHTML, { maxWidth: 300, minWidth: 260 });
        
        const progId = getProp(prog, ['Program', 'Program Name', 'Name']);
        markersMap.set(progId, marker);
      }
    });
  }

  function initMap() {
    const mapEl = document.getElementById('map');
    if (!mapEl) return;

    map = L.map('map', { zoomControl: false }).setView([39.8283, -98.5795], 4);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      subdomains: 'abcd',
      attribution: '&copy; OpenStreetMap &copy; CARTO'
    }).addTo(map);

    if (allPrograms.length > 0) {
      renderMapMarkers(allPrograms);
    }
  }

  // Initialize map when DOM is ready
  document.addEventListener("DOMContentLoaded", () => {
    initMap();
  });
</script>

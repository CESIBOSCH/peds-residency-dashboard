<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pediatric Residency Dashboard</title>
  <!-- Tailwind CSS for sleek, Scandinavian minimalist styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PapaParse for reading CSV files -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <style>
    body { background-color: #fcfbf9; color: #4a4540; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="p-6 md:p-12 max-w-7xl mx-auto">

  <!-- Header Section -->
  <header class="mb-10 pb-6 border-b border-stone-200">
    <h1 class="text-3xl font-light tracking-wide text-stone-800">Pediatric Residency Dashboard</h1>
    <p class="text-sm text-stone-500 mt-1">Master tracking & decision matrix for residency programs</p>
  </header>

  <!-- Controls / Search Section -->
  <div class="flex flex-col sm:flex-row gap-4 mb-8">
    <input type="text" id="searchInput" placeholder="Search program, city, or state..." 
      class="w-full sm:w-96 px-4 py-2.5 rounded-lg bg-stone-100 border border-stone-200 text-stone-800 placeholder-stone-400 focus:outline-none focus:ring-1 focus:ring-stone-400 transition" />
  </div>

  <!-- Data Table Container -->
  <div class="overflow-x-auto bg-white rounded-xl shadow-sm border border-stone-200/80">
    <table class="w-full text-left text-sm text-stone-700" id="dataTable">
      <thead class="bg-stone-50/80 uppercase text-xs tracking-wider text-stone-500 border-b border-stone-200" id="tableHead">
        <!-- Headers populated dynamically -->
      </thead>
      <tbody class="divide-y divide-stone-100" id="tableBody">
        <tr><td class="p-6 text-stone-400">Loading program data...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    let allData = [];

    // Load and parse CSV data
    Papa.parse("programs.csv", {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        allData = results.data;
        renderTable(allData);
      }
    });

    function renderTable(data) {
      if (!data || data.length === 0) return;

      const headers = Object.keys(data[0]);
      
      // Render Table Headers
      const headEl = document.getElementById("tableHead");
      headEl.innerHTML = `<tr>${headers.map(h => `<th class="px-6 py-4 font-medium">${h}</th>`).join('')}</tr>`;

      // Render Rows
      const bodyEl = document.getElementById("tableBody");
      bodyEl.innerHTML = data.map(row => `
        <tr class="hover:bg-stone-50/60 transition-colors">
          ${headers.map(h => `<td class="px-6 py-4 text-stone-600">${row[h] || '—'}</td>`).join('')}
        </tr>
      `).join('');
    }

    // Search Filter
    document.getElementById("searchInput").addEventListener("input", (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = allData.filter(row => 
        Object.values(row).some(val => String(val).toLowerCase().includes(term))
      );
      renderTable(filtered);
    });
  </script>
</body>
</html>

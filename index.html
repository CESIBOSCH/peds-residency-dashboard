    "Seattle, WA": [47.6062, -122.3321]
  };

  // Normalizes string for fuzzy header matching
  function cleanKey(str) {
    return String(str || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  }

  // Enhanced Fuzzy Prop Extractor
  function getProp(obj, possibleKeys, defaultVal = 'N/A') {
    if (!obj) return defaultVal;
    const objKeys = Object.keys(obj);
    
    // First try exact fuzzy match
    for (const keyCandidate of possibleKeys) {
      const targetClean = cleanKey(keyCandidate);
      const matchedKey = objKeys.find(k => cleanKey(k) === targetClean);
      if (matchedKey && obj[matchedKey] !== undefined && obj[matchedKey] !== null) {
        const val = String(obj[matchedKey]).trim();
        if (val !== '' && val !== '-') {
          return val;
        }
      }
    }

    // Second try: partial inclusion match
    for (const keyCandidate of possibleKeys) {
      const targetClean = cleanKey(keyCandidate);
      const matchedKey = objKeys.find(k => cleanKey(k).includes(targetClean));
      if (matchedKey && obj[matchedKey] !== undefined && obj[matchedKey] !== null) {
        const val = String(obj[matchedKey]).trim();
        if (val !== '' && val !== '-') {
          return val;
        }
      }
    }

    return defaultVal;
  }

  function formatCurrency(val) {
    if (!val || val === 'N/A') return 'N/A';
    const cleanNum = parseFloat(String(val).replace(/[^0-9.-]+/g, ""));
    if (isNaN(cleanNum)) return val;
    return '$' + cleanNum.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function isTrueValue(val) {
    if (!val || val === 'N/A') return false;
    const cleanVal = String(val).trim().toLowerCase();
    return ['yes', 'true', '1', 'x', 'y'].includes(cleanVal);
  }

  function cleanSettingName(val) {
    if (!val || val === 'N/A') return 'N/A';
    let cleaned = val.trim();
    if (cleaned.toLowerCase().includes("university affiliated") || cleaned.toLowerCase().includes("cb/university")) {
      return "Community-Based Univ. Affiliated";
    }
    return cleaned;
  }

  function initMap() {
    map = L.map('map', { zoomControl: false }).setView([39.8283, -98.5795], 4);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      subdomains: 'abcd',
      attribution: '&copy; OpenStreetMap &copy; CARTO'
    }).addTo(map);
  }

  function createInMapFactSheetPopup(prog) {
    const city = getProp(prog, ['City', 'Location City', 'Town']);
    const state = getProp(prog, ['State', 'Location State', 'ST']);
    const cityStateKey = `${city}, ${state}`;

    const rawWebsite = getProp(prog, ['Website', 'URL', 'Program Website', 'Link', 'Web'], '#');
    const programName = getProp(prog, ['Program', 'Program Name', 'Hospital', 'Institution', 'Name'], 'Program Info');

    // Airport Code with automatic lookup fallback
    let airport = getProp(prog, ['Nearest Airport', 'Airport', 'Airport Code', 'Nearest Airport Code']);
    if (airport === 'N/A') {
      airport = airportLookup[cityStateKey] || (city !== 'N/A' ? `${city.substring(0,3).toUpperCase()}` : 'N/A');
    }

    // Benefits Badges
    let perksHTML = '';
    const perks = [
      { label: 'Parking', val: getProp(prog, ['Free Parking', 'Parking', 'Parking Stipend']) },
      { label: 'Housing', val: getProp(prog, ['Housing Stipend', 'Housing', 'Housing Allowance']) },
      { label: 'Meals', val: getProp(prog, ['Meal Stipend', 'Meals', 'Food Stipend']) },
      { label: 'Tech', val: getProp(prog, ['Tech Stipend', 'Tech', 'Technology Allowance']) }
    ];

    perks.forEach(p => {
      if (isTrueValue(p.val)) {
        perksHTML += `<span class="text-[9px] bg-[#EBF3ED] text-[#2D3132] border border-[#A8C5B0] px-1.5 py-0.5 rounded">✓ ${p.label}</span> `;
      }
    });
    if (!perksHTML) perksHTML = `<span class="text-[10px] text-[#6B7280] italic">Standard Benefits</span>`;

    // Extract values using comprehensive CSV field keys
    const classSize = getProp(prog, ['Class size', 'Class Size', 'Class size per year', 'Size', 'Program Size']);
    const setting = cleanSettingName(getProp(prog, ['Setting', 'Program Setting', 'Hospital Setting', 'Environment']));
    const tier = getProp(prog, ['Competitiveness', 'Tier', 'Category', 'Target/Reach', 'Reach/Target', 'Tier / Category']);
    const stepScore = getProp(prog, ['Step Score Range', 'Step Score', 'USMLE Step 2', 'Step 2 Range', 'Target Step']);

    const avgHours = getProp(prog, ['Work Hours', 'Average Hours Worked', 'Average Hours', 'Hours/Week', 'Avg Hours']);
    const shiftLength = getProp(prog, ['Longest Shift Length', 'Shift Length', 'Max Shift Length', 'Longest Shift', 'Max Shift']);
    const daysOff = getProp(prog, ['Days Off Per Week', 'Average Days Off Per Week', 'Days Off', 'Days Off/Week']);
    const sickDays = getProp(prog, ['Sick Days', 'Sick Leave Days', 'Sick Leave']);
    const vacationDays = getProp(prog, ['Vacation', 'Vacation Days', 'PTO']);
    
    const paidLeave = getProp(prog, ['Paid Family Leave Days', 'Paid Family Leave', 'Paid Leave', 'Paid Family Leave (days)']);
    const unpaidLeave = getProp(prog, ['Unpaid Family Leave Days', 'Unpaid Family Leave', 'Unpaid Leave', 'Unpaid Family Leave (days)']);

    const baseSalary = formatCurrency(getProp(prog, ['Salary', 'Base Salary', 'PGY1 Salary', 'PGY-1 Salary']));
    const colSalary = formatCurrency(getProp(prog, ['COL Adjusted Salary', 'COL-Adjusted Salary', 'Adjusted Salary', 'Cost of Living Adjusted Salary']));
    const stretchScore = getProp(prog, ['Salary Stretch Score', 'Stretch Score', 'Salary Score']);

    const formattedWebsite = rawWebsite !== '#' ? (rawWebsite.startsWith('http') ? rawWebsite : 'https://' + rawWebsite) : '#';

    return `
      <div class="p-3.5 space-y-2.5 font-sans max-h-[410px] overflow-y-auto custom-scroll bg-white">
        
        <!-- Header with Hyperlink -->
        <div class="border-b border-[#E5E0D8] pb-1.5">
          <h3 class="font-semibold text-xs text-[#2D3132] leading-tight">
            ${formattedWebsite !== '#' ? `<a href="${formattedWebsite}" target="_blank" rel="noopener noreferrer" class="text-[#2D3132] hover:text-[#C86D51] hover:underline flex items-center gap-1">${programName} <span class="text-[9px] text-[#C86D51]">↗</span></a>` : programName}
          </h3>
        </div>

        <!-- Section 1: Basics -->
        <div class="space-y-1">
          <span class="text-[9px] font-semibold uppercase tracking-wider text-[#6B7280]">Basics</span>
          <div class="grid grid-cols-2 gap-1.5 text-[10px]">
            <div class="bg-[#FAF9F5] p-1.5 rounded border border-[#E5E0D8]">
              <span class="text-[#6B7280] block text-[8px] uppercase font-medium">Location</span>
              <span class="font-medium text-[#2D3132] truncate block">${city}, ${state}</span>
            </div>
            <div class="bg-[#FAF9F5] p-1.5 rounded border border-[#E5E0D8]">
              <span class="text-[#6B7280] block text-[8px] uppercase font-medium">Nearest Airport</span>
              <span class="font-medium text-[#2D3132] truncate block">${airport}</span>
            </div>
          </div>
          <div class="grid grid-cols-4 gap-1.5 text-[10px]">
            <div class="col-span-3 bg-[#FAF9F5] p-1.5 rounded border border-[#E5E0D8]">
              <span class="text-[#6B7280] block text-[8px] uppercase font-medium">Setting</span>
              <span class="font-medium text-[#2D3132] block truncate">${setting}</span>
            </div>
            <div class="col-span-1 bg-[#FAF9F5] p-1.5 rounded border border-[#E5E0D8] text-center">
              <span class="text-[#6B7280] block text-[8px] uppercase font-medium">Class Size</span>
              <span class="font-medium text-[#2D3132]">${classSize}</span>
            </div>
          </div>
        </div>

        <!-- Section 2: Application -->
        <div class="space-y-1">
          <span class="text-[9px] font-semibold uppercase tracking-wider text-[#6B7280]">Application</span>
          <div class="grid grid-cols-2 gap-1.5 text-[10px]">

              <span class="font-medium text-[#2D3132]">${stepScore}</span>

          </div>
        </div>

        <!-- Section 3: Work & Leave -->
        <div class="space-y-1">

          <div class="bg-[#FAF9F5] p-2 rounded border border-[#E5E0D8] text-[10px] space-y-1">
            <div class="flex justify-between">
              <span class="text-[#6B7280]">Average Hours/Week:</span>
              <span class="font-medium text-[#2D3132]">${avgHours}</span>
            </div>
            <div class="flex justify-between border-t border-[#E5E0D8]/60 pt-1">
              <span class="text-[#6B7280]">Longest Shift Length:</span>
              <span class="font-medium text-[#2D3132]">${shiftLength}</span>
            </div>
            <div class="flex justify-between border-t border-[#E5E0D8]/60 pt-1">
              <span class="text-[#6B7280]">Days Off/Week:</span>
              <span class="font-medium text-[#2D3132]">${daysOff}</span>
            </div>
            <div class="flex justify-between border-t border-[#E5E0D8]/60 pt-1">
              <span class="text-[#6B7280]">Sick Days:</span>
              <span class="font-medium text-[#2D3132]">${sickDays}</span>
            </div>
            <div class="flex justify-between border-t border-[#E5E0D8]/60 pt-1">

        <!-- Perks -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pediatric Residency Navigator</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- PapaParse for reading CSV files -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  
  <!-- Leaflet CSS & JS for Interactive Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg-ivory: #FAF8F3;
      --bg-cream: #F3EFE5;
      --text-charcoal: #343A3B;
      --text-gray: #74736E;
      --accent-mushroom: #D8CDBD;
      --accent-terracotta: #C86D51;
      --accent-terracotta-soft: #F5ECE8;
      --accent-sage: #E2E9E3;
    }

    body { 
      background-color: var(--bg-ivory); 
      color: var(--text-charcoal); 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }

    /* Tooltip */
    .leaflet-tooltip.custom-map-tooltip {
      background: var(--bg-ivory);
      border: 1px solid var(--accent-mushroom);
      color: var(--text-charcoal);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 500;
      box-shadow: 0 4px 12px rgba(52, 58, 59, 0.12);
    }

    /* Custom Expanded Leaflet Popup Styling */
    .leaflet-popup-content-wrapper {
      background: #FAF8F3;
      border: 1px solid #D8CDBD;
      border-radius: 14px;
      padding: 0;
      box-shadow: 0 12px 30px -5px rgba(52, 58, 59, 0.2);
      overflow: hidden;
    }
    .leaflet-popup-content {
      margin: 0 !important;
      width: 300px !important;
    }
    .leaflet-popup-tip {
      background: #FAF8F3;
    }

    /* Custom Pins */
    .custom-desert-pin {
      background-color: #343A3B;
      border: 2px solid #FAF8F3;
      width: 16px !important;
      height: 16px !important;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(52, 58, 59, 0.25);
      transition: transform 0.2s ease, background-color 0.2s ease;
      cursor: pointer;
    }
    .custom-desert-pin:hover {
      transform: scale(1.35);
      background-color: var(--accent-terracotta);
    }

    /* Sliders & Scrollbars */
    input[type=range]::-webkit-slider-thumb {
      background: var(--accent-terracotta);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      cursor: pointer;
      -webkit-appearance: none;
    }
    
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background-color: var(--accent-mushroom);
      border-radius: 4px;
    }

    input[type="checkbox"] {
      accent-color: var(--accent-terracotta);
    }
  </style>
</head>
<body class="min-h-screen w-screen flex flex-col p-4 md:p-8 gap-5">

  <!-- HEADER -->
  <header class="w-full max-w-7xl mx-auto flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b border-[#D8CDBD]/80">
    <div>
      <div class="flex items-center gap-2">
        <span class="text-xs font-medium tracking-widest uppercase text-[#C86D51]">Interactive Directory</span>
        <span class="text-xs text-[#D8CDBD]">•</span>
        <span class="text-xs text-[#74736E]">Pediatrics Residency Explorer</span>
      </div>
      <h1 class="text-2xl md:text-3xl font-light tracking-tight text-[#343A3B] mt-1">Program Selection Guide</h1>
    </div>
    <div class="flex items-center gap-3">
      <span id="programCount" class="text-xs font-medium text-[#C86D51] bg-[#F5ECE8] px-3 py-1 rounded-full border border-[#C86D51]/30">0 Programs Found</span>
    </div>
  </header>

  <!-- MAIN CANVAS -->
  <div class="w-full max-w-7xl mx-auto flex-1 flex flex-col md:flex-row gap-6 min-h-[680px]">

    <!-- SIDEBAR -->
    <aside class="w-full md:w-[260px] lg:w-[280px] bg-[#FAF8F3] border border-[#D8CDBD]/80 rounded-2xl flex flex-col shrink-0 shadow-sm overflow-hidden">
      
      <div class="px-4 py-3 border-b border-[#D8CDBD]/60 bg-[#F3EFE5]">
        <h2 class="text-xs font-semibold uppercase tracking-wider text-[#343A3B]">Filter Options</h2>
      </div>

      <div class="p-4 border-b border-[#D8CDBD]/40 space-y-3 custom-scroll max-h-[360px] overflow-y-auto">
        <div class="space-y-1">
          <label class="text-[10px] font-semibold uppercase tracking-wider text-[#74736E]">Search</label>
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Search name, city..." 
            class="w-full px-2.5 py-1.5 rounded-lg border border-[#D8CDBD] placeholder-[#74736E]/60 focus:outline-none focus:border-[#C86D51] text-xs transition bg-white text-[#343A3B]"
          />
        </div>

        <div class="space-y-2.5">
          <!-- State Filter -->
          <div class="space-y-1 relative dropdown-container">
            <div class="flex justify-between items-center">
              <label class="text-[10px] font-semibold uppercase tracking-wider text-[#74736E]">State</label>
              <button type="button" id="resetStateBtn" class="text-[9px] text-[#74736E] hover:text-[#C86D51] underline hidden">Clear</button>
            </div>
            <button type="button" data-dropdown="state" class="dropdown-btn w-full px-2.5 py-1.5 rounded-lg border border-[#D8CDBD] text-xs focus:outline-none flex justify-between items-center text-left hover:border-[#C86D51] bg-white text-[#343A3B]">
              <span id="stateDropdownLabel" class="truncate">All States</span>
              <span class="text-[8px] text-[#C86D51]">▼</span>
            </button>
            <div id="stateDropdownMenu" class="dropdown-menu hidden absolute left-0 right-0 mt-1 max-h-48 overflow-y-auto bg-white border border-[#D8CDBD] rounded-lg shadow-lg z-50 p-2 space-y-1 text-xs custom-scroll"></div>
          </div>

          <!-- Interest Filter -->
          <div class="space-y-1 relative dropdown-container">
            <div class="flex justify-between items-center">
              <label class="text-[10px] font-semibold uppercase tracking-wider text-[#74736E]">Interest Level</label>
              <button type="button" id="resetInterestBtn" class="text-[9px] text-[#74736E] hover:text-[#C86D51] underline hidden">Clear</button>
            </div>
            <button type="button" data-dropdown="interest" class="dropdown-btn w-full px-2.5 py-1.5 rounded-lg border border-[#D8CDBD] text-xs focus:outline-none flex justify-between items-center text-left hover:border-[#C86D51] bg-white text-[#343A3B]">
              <span id="interestDropdownLabel" class="truncate">All Levels</span>
              <span class="text-[8px] text-[#C86D51]">▼</span>
            </button>
            <div id="interestDropdownMenu" class="dropdown-menu hidden absolute left-0 right-0 mt-1 max-h-48 overflow-y-auto bg-white border border-[#D8CDBD] rounded-lg shadow-lg z-50 p-2 space-y-1 text-xs custom-scroll"></div>
          </div>

          <!-- Setting Filter -->
          <div class="space-y-1 relative dropdown-container">
            <div class="flex justify-between items-center">
              <label class="text-[10px] font-semibold uppercase tracking-wider text-[#74736E]">Program Setting</label>
              <button type="button" id="resetSettingBtn" class="text-[9px] text-[#74736E] hover:text-[#C86D51] underline hidden">Clear</button>
            </div>
            <button type="button" data-dropdown="setting" class="dropdown-btn w-full px-2.5 py-1.5 rounded-lg border border-[#D8CDBD] text-xs focus:outline-none flex justify-between items-center text-left hover:border-[#C86D51] bg-white text-[#343A3B]">
              <span id="settingDropdownLabel" class="truncate">All Settings</span>
              <span class="text-[8px] text-[#C86D51]">▼</span>
            </button>
            <div id="settingDropdownMenu" class="dropdown-menu hidden absolute left-0 right-0 mt-1 max-h-48 overflow-y-auto bg-white border border-[#D8CDBD] rounded-lg shadow-lg z-50 p-2 space-y-1 text-xs custom-scroll"></div>
          </div>

          <!-- Competitiveness Filter -->
          <div class="space-y-1 relative dropdown-container">
            <div class="flex justify-between items-center">
              <label class="text-[10px] font-semibold uppercase tracking-wider text-[#74736E]">Competitiveness</label>
              <button type="button" id="resetCompetitivenessBtn" class="text-[9px] text-[#74736E] hover:text-[#C86D51] underline hidden">Clear</button>
            </div>
            <button type="button" data-dropdown="competitiveness" class="dropdown-btn w-full px-2.5 py-1.5 rounded-lg border border-[#D8CDBD] text-xs focus:outline-none flex justify-between items-center text-left hover:border-[#C86D51] bg-white text-[#343A3B]">
              <span id="competitivenessDropdownLabel" class="truncate">All Tiers</span>
              <span class="text-[8px] text-[#C86D51]">▼</span>
            </button>
            <div id="competitivenessDropdownMenu" class="dropdown-menu hidden absolute left-0 right-0 mt-1 max-h-48 overflow-y-auto bg-white border border-[#D8CDBD] rounded-lg shadow-lg z-50 p-2 space-y-1 text-xs custom-scroll"></div>
          </div>
        </div>

        <!-- Class Size Slider -->
        <div class="pt-2 space-y-1">
          <div class="flex justify-between items-center">
            <span class="text-[10px] font-semibold uppercase tracking-wider text-[#74736E]">Max Class Size:</span>
            <span id="classSizeValue" class="text-[11px] font-medium px-1.5 rounded border border-[#C86D51]/30 bg-[#F5ECE8] text-[#C86D51]">50</span>
          </div>
          <input 
            type="range" 
            id="classSizeFilter" 
            min="1" 
            max="50" 
            value="50" 
            class="w-full h-1 bg-[#D8CDBD] rounded-lg appearance-none cursor-pointer"
          />
        </div>

        <!-- Perks -->
        <div class="pt-2 border-t border-[#D8CDBD]/40">
          <label class="text-[10px] font-semibold uppercase tracking-wider text-[#74736E] block mb-1.5">Key Benefits</label>
          <div class="grid grid-cols-2 gap-y-1.5 text-xs text-[#343A3B]">
            <label class="inline-flex items-center gap-1.5 cursor-pointer hover:text-[#C86D51]">
              <input type="checkbox" id="parkingFilter" class="rounded border-[#D8CDBD]"> Parking
            </label>
            <label class="inline-flex items-center gap-1.5 cursor-pointer hover:text-[#C86D51]">
              <input type="checkbox" id="housingFilter" class="rounded border-[#D8CDBD]"> Housing
            </label>
            <label class="inline-flex items-center gap-1.5 cursor-pointer hover:text-[#C86D51]">
              <input type="checkbox" id="mealFilter" class="rounded border-[#D8CDBD]"> Meals
            </label>
            <label class="inline-flex items-center gap-1.5 cursor-pointer hover:text-[#C86D51]">
              <input type="checkbox" id="techFilter" class="rounded border-[#D8CDBD]"> Tech
            </label>
          </div>
        </div>

      </div>

      <!-- Program List -->
      <div id="programList" class="flex-1 overflow-y-auto p-3 space-y-2.5 custom-scroll bg-[#FAF8F3]"></div>

    </aside>

    <!-- MAP -->
    <main class="flex-1 min-h-[500px] rounded-2xl border border-[#D8CDBD]/80 overflow-hidden shadow-sm relative bg-[#F3EFE5]">
      <div id="map" class="w-full h-full"></div>
    </main>

  </div>

  <script>
    let allPrograms = [];
    let selectedFilters = { state: new Set(), interest: new Set(), setting: new Set(), competitiveness: new Set() };
    let map;
    let markersMap = new Map();
    let airportCache = new Map();

    const cityCoordinates = {
      "Phoenix, AZ": [33.4484, -112.0740],
      "Los Angeles, CA": [34.0522, -118.2437],
      "San Francisco, CA": [37.7749, -122.4194],
      "Oakland, CA": [37.8044, -122.2712],
      "Sacramento, CA": [38.5816, -121.4944],
      "San Diego, CA": [32.7157, -117.1611],
      "New Haven, CT": [41.3083, -72.9279],
      "Denver, CO": [39.7392, -104.9903],
      "Washington, DC": [38.9072, -77.0369],
      "Chicago, IL": [41.8781, -87.6298],
      "Boston, MA": [42.3601, -71.0589],
      "Baltimore, MD": [39.2904, -76.6122],
      "Ann Arbor, MI": [42.2808, -83.7430],
      "Minneapolis, MN": [44.9778, -93.2650],
      "St. Louis, MO": [38.6270, -90.1994],
      "Chapel Hill, NC": [35.9132, -79.0558],
      "Charlotte, NC": [35.2271, -80.8431],
      "Philadelphia, PA": [39.9526, -75.1652],
      "Pittsburgh, PA": [40.4406, -79.9959],
      "Seattle, WA": [47.6062, -122.3321]
    };

    function cleanSettingName(val) {
      if (!val) return 'N/A';
      let cleaned = val.trim();
      if (cleaned === "CB/University Affiliated" || cleaned === "CB / University Affiliated") {
        return "Community-Based Univ. Affiliated";
      }
      return cleaned;
    }

    function isTrueValue(val) {
      if (!val) return false;
      const cleanVal = String(val).trim().toLowerCase();
      return ['yes', 'true', '1', 'x', 'y'].includes(cleanVal);
    }

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([39.8283, -98.5795], 4);
      L.control.zoom({ position: 'bottomright' }).addTo(map);

      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        subdomains: 'abcd',
        attribution: '&copy; OpenStreetMap &copy; CARTO'
      }).addTo(map);
    }

    // Dynamic Airport Lookup using OpenStreetMap Nominatim API
    async function getNearestAirport(city, state, lat, lng) {
      const cacheKey = `${city}_${state}`;
      if (airportCache.has(cacheKey)) return airportCache.get(cacheKey);

      try {
        const query = encodeURIComponent(`international airport near ${city} ${state}`);
        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${query}&limit=1`);
        const data = await response.json();

        if (data && data.length > 0) {
          const airportName = data[0].display_name.split(',')[0];
          airportCache.set(cacheKey, airportName);
          return airportName;
        }
      } catch (err) {
        console.warn("Could not auto-fetch airport:", err);
      }

      const fallback = `${city} Regional Airport`;
      airportCache.set(cacheKey, fallback);
      return fallback;
    }

    function createInMapFactSheetPopup(prog) {
      const city = prog['City'] || '';
      const state = prog['State'] || '';
      const interest = prog['Interest'] || 'Standard';

      // Reads 'Nearest Airport' or 'Airport' from CSV if present
      const airportFromCSV = prog['Nearest Airport'] || prog['Airport'] || null;

      let perksHTML = '';
      const perks = [
        { label: 'Parking', val: prog['Free Parking'] || prog['Parking'] },
        { label: 'Housing', val: prog['Housing Stipend'] || prog['Housing'] },
        { label: 'Meals', val: prog['Meal Stipend'] || prog['Meals'] },
        { label: 'Tech', val: prog['Tech Stipend'] || prog['Tech'] }
      ];

      perks.forEach(p => {
        if (isTrueValue(p.val)) {
          perksHTML += `<span class="text-[9px] bg-[#E2E9E3] text-[#343A3B] border border-[#82988B]/40 px-1.5 py-0.5 rounded">✓ ${p.label}</span> `;
        }
      });

      if (!perksHTML) perksHTML = `<span class="text-[10px] text-[#74736E] italic">Standard Benefits</span>`;

      // Unique container ID for dynamic airport loading
      const airportContainerId = `airport-${(prog['Program'] || 'prog').replace(/[^a-zA-Z0-0]/g, '')}`;

      // Auto-trigger dynamic airport lookup if not in CSV
      if (!airportFromCSV) {
        getNearestAirport(city, state, prog['Latitude'], prog['Longitude']).then(airportName => {
          const el = document.getElementById(airportContainerId);
          if (el) el.innerText = airportName;
        });
      }

      return `
        <div class="p-3.5 space-y-2.5 font-sans">
          <!-- Header -->
          <div class="border-b border-[#D8CDBD]/60 pb-2">
            <span class="text-[9px] font-semibold uppercase px-1.5 py-0.5 rounded border border-[#C86D51]/30 bg-[#F5ECE8] text-[#C86D51] inline-block mb-1">${interest}</span>
            <h3 class="font-medium text-xs text-[#343A3B] leading-snug">${prog['Program'] || 'Program Info'}</h3>
            <p class="text-[10px] text-[#74736E] mt-0.5">${city}${city && state ? ', ' : ''}${state}</p>
          </div>

          <!-- Airport Field -->
          <div class="bg-[#F3EFE5] p-2 rounded-lg border border-[#D8CDBD]/60 text-[10px] flex justify-between items-center">
            <span class="font-semibold text-[#343A3B] flex items-center gap-1">✈️ Nearest Airport:</span>
            <span id="${airportContainerId}" class="font-medium text-[#C86D51] text-right truncate max-w-[160px]">
              ${airportFromCSV || 'Searching airport...'}
            </span>
          </div>

          <!-- Stats Grid -->
          <div class="grid grid-cols-2 gap-1.5 text-[10px]">
            <div class="bg-white p-1.5 rounded border border-[#D8CDBD]/50">
              <span class="text-[#74736E] block text-[8px] uppercase">Setting</span>
              <span class="font-medium text-[#343A3B] truncate block">${cleanSettingName(prog['Setting'])}</span>
            </div>
            <div class="bg-white p-1.5 rounded border border-[#D8CDBD]/50">
              <span class="text-[#74736E] block text-[8px] uppercase">Class Size</span>
              <span class="font-medium text-[#343A3B]">${prog['Class size'] || 'N/A'}</span>
            </div>
            <div class="bg-white p-1.5 rounded border border-[#D8CDBD]/50">
              <span class="text-[#74736E] block text-[8px] uppercase">Competitiveness</span>
              <span class="font-medium text-[#343A3B]">${prog['Competitiveness'] || 'N/A'}</span>
            </div>
            <div class="bg-white p-1.5 rounded border border-[#D8CDBD]/50">
              <span class="text-[#74736E] block text-[8px] uppercase">Step Score</span>
              <span class="font-medium text-[#343A3B]">${prog['Step Score Range'] || prog['Step Score'] || 'N/A'}</span>
            </div>
          </div>

          <!-- Work & Leave -->
          <div class="bg-white p-2 rounded border border-[#D8CDBD]/50 text-[10px] space-y-1">
            <div class="flex justify-between">
              <span class="text-[#74736E]">Avg Hours:</span>
              <span class="font-medium text-[#343A3B]">${prog['Work Hours'] || 'Standard ACGME'}</span>
            </div>
            <div class="flex justify-between border-t border-[#F3EFE5] pt-1">
              <span class="text-[#74736E]">Leave:</span>
              <span class="font-medium text-[#343A3B]">${prog['Vacation'] || '4 Weeks Paid'}</span>
            </div>
          </div>

          <!-- Perks -->
          <div class="pt-1 border-t border-[#D8CDBD]/40">
            <span class="text-[9px] text-[#74736E] uppercase font-semibold block mb-1">Perks & Benefits:</span>
            <div class="flex flex-wrap gap-1">${perksHTML}</div>
          </div>
        </div>
      `;
    }

    const desertIcon = L.divIcon({
      className: 'custom-desert-pin',
      iconSize: [16, 16],
      iconAnchor: [8, 8]
    });

    function createMapPins(programs) {
      programs.forEach(prog => {
        const programName = prog['Program'] || 'N/A';
        const city = (prog['City'] || '').trim();
        const state = (prog['State'] || '').trim();
        const cityStateKey = `${city}, ${state}`;

        let lat = parseFloat(prog['Latitude'] || prog['lat']);
        let lng = parseFloat(prog['Longitude'] || prog['lng']);

        if ((isNaN(lat) || isNaN(lng)) && cityCoordinates[cityStateKey]) {
          [lat, lng] = cityCoordinates[cityStateKey];
        }

        if (!isNaN(lat) && !isNaN(lng)) {
          const marker = L.marker([lat, lng], { icon: desertIcon }).addTo(map);
          
          marker.bindTooltip(`
            <div class="font-sans">
              <div class="font-semibold text-[#343A3B]">${programName}</div>
              <div class="text-[10px] text-[#74736E]">${city}${city && state ? ', ' : ''}${state}</div>
            </div>
          `, { className: 'custom-map-tooltip', direction: 'top', offset: [0, -6] });

          marker.bindPopup(createInMapFactSheetPopup(prog));
          markersMap.set(programName, marker);
        }
      });
    }

    function renderSidebarList(programs) {
      const listContainer = document.getElementById('programList');
      listContainer.innerHTML = '';

      document.getElementById('programCount').innerText = `${programs.length} Programs Found`;

      if (programs.length === 0) {
        listContainer.innerHTML = `<p class="text-xs text-[#74736E] text-center py-8">No matching programs found.</p>`;
        return;
      }

      programs.forEach(prog => {
        const programName = prog['Program'] || 'N/A';
        const city = prog['City'] || '';
        const state = prog['State'] || '';
        const interest = prog['Interest'] || '-';
        const setting = cleanSettingName(prog['Setting']);

        const card = document.createElement('div');
        card.className = "p-3 rounded-xl border border-[#D8CDBD]/70 bg-white shadow-sm hover:border-[#C86D51] transition group cursor-pointer";
        
        card.innerHTML = `
          <div class="flex justify-between items-start gap-1">
            <h3 class="font-medium text-xs leading-snug text-[#343A3B] group-hover:text-[#C86D51] transition-colors">${programName}</h3>
          </div>
          <p class="text-[10px] text-[#74736E] mt-0.5">${city}${city && state ? ', ' : ''}${state}</p>
          <div class="mt-2 pt-1.5 border-t border-[#F3EFE5] flex justify-between items-center text-[10px] text-[#74736E]">
            <span class="truncate max-w-[120px]">${setting}</span>
            <span class="font-medium text-[#C86D51] bg-[#F5ECE8] px-1.5 py-0.5 rounded">${interest}</span>
          </div>
          <div class="mt-2 pt-1.5 border-t border-[#F3EFE5] flex gap-2 text-[10px]">
            <button class="locate-btn flex-1 py-1 rounded bg-[#F3EFE5] hover:bg-[#C86D51] hover:text-white transition text-[#343A3B] font-medium text-center">Locate & View Details</button>
          </div>
        `;

        card.querySelector('.locate-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          triggerProgramFocus(programName);
        });

        card.addEventListener('click', () => {
          triggerProgramFocus(programName);
        });

        listContainer.appendChild(card);
      });
    }

    function triggerProgramFocus(programName) {
      const marker = markersMap.get(programName);
      if (marker) {
        map.flyTo(marker.getLatLng(), 11, { duration: 1.2 });
        marker.openPopup();
      }
    }

    function buildMultiSelectDropdown(type, values, placeholder) {
      const menu = document.getElementById(`${type}DropdownMenu`);
      menu.innerHTML = '';

      Array.from(values).sort().forEach(val => {
        const displayVal = type === 'setting' ? cleanSettingName(val) : val;
        const label = document.createElement('label');
        label.className = "flex items-center gap-2 px-1.5 py-1 hover:bg-[#F5ECE8] rounded cursor-pointer text-stone-700 transition";
        label.innerHTML = `
          <input type="checkbox" value="${val}" data-type="${type}" class="filter-checkbox rounded border-[#D8CDBD]">
          <span class="truncate">${displayVal}</span>
        `;
        menu.appendChild(label);
      });

      menu.querySelectorAll('.filter-checkbox').forEach(cb => {
        cb.addEventListener('change', (e) => {
          const filterType = e.target.getAttribute('data-type');
          if (e.target.checked) {
            selectedFilters[filterType].add(e.target.value);
          } else {
            selectedFilters[filterType].delete(e.target.value);
          }
          updateDropdownLabel(filterType, placeholder);
          applyFilters();
        });
      });
    }

    function updateDropdownLabel(type, placeholder) {
      const label = document.getElementById(`${type}DropdownLabel`);
      const resetBtn = document.getElementById(`reset${type.charAt(0).toUpperCase() + type.slice(1)}Btn`);
      const count = selectedFilters[type].size;

      if (count === 0) {
        label.innerText = placeholder;
        resetBtn.classList.add('hidden');
      } else if (count === 1) {
        const val = Array.from(selectedFilters[type])[0];
        label.innerText = type === 'setting' ? cleanSettingName(val) : val;
        resetBtn.classList.remove('hidden');
      } else {
        label.innerText = `${count} Selected`;
        resetBtn.classList.remove('hidden');
      }
    }

    function setupDropdownControls() {
      document.querySelectorAll('.dropdown-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const targetType = btn.getAttribute('data-dropdown');
          const targetMenu = document.getElementById(`${targetType}DropdownMenu`);
          
          document.querySelectorAll('.dropdown-menu').forEach(m => {
            if (m !== targetMenu) m.classList.add('hidden');
          });
          targetMenu.classList.toggle('hidden');
        });
      });

      document.addEventListener('click', () => {
        document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.add('hidden'));
      });

      ['state', 'interest', 'setting', 'competitiveness'].forEach(type => {
        const placeholders = { state: 'All States', interest: 'All Levels', setting: 'All Settings', competitiveness: 'All Tiers' };
        const resetBtn = document.getElementById(`reset${type.charAt(0).toUpperCase() + type.slice(1)}Btn`);
        resetBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          selectedFilters[type].clear();
          const menu = document.getElementById(`${type}DropdownMenu`);
          menu.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
          updateDropdownLabel(type, placeholders[type]);
          applyFilters();
        });
      });
    }

    function populateDropdowns(data) {
      const sets = { state: new Set(), interest: new Set(), setting: new Set(), competitiveness: new Set() };
      let maxClassFound = 0;

      data.forEach(prog => {
        if (prog['State']) sets.state.add(prog['State'].trim());
        if (prog['Interest']) sets.interest.add(prog['Interest'].trim());
        if (prog['Setting']) sets.setting.add(prog['Setting'].trim());
        if (prog['Competitiveness']) sets.competitiveness.add(prog['Competitiveness'].trim());
        
        const size = parseInt(prog['Class size']);
        if (!isNaN(size) && size > maxClassFound) maxClassFound = size;
      });

      buildMultiSelectDropdown('state', sets.state, 'All States');
      buildMultiSelectDropdown('interest', sets.interest, 'All Levels');
      buildMultiSelectDropdown('setting', sets.setting, 'All Settings');
      buildMultiSelectDropdown('competitiveness', sets.competitiveness, 'All Tiers');

      if (maxClassFound > 0) {
        const slider = document.getElementById('classSizeFilter');
        slider.max = maxClassFound;
        slider.value = maxClassFound;
        document.getElementById('classSizeValue').innerText = maxClassFound;
      }
    }

    function applyFilters() {
      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      const maxClassSize = parseInt(document.getElementById('classSizeFilter').value);

      const requireParking = document.getElementById('parkingFilter').checked;
      const requireHousing = document.getElementById('housingFilter').checked;
      const requireMeal = document.getElementById('mealFilter').checked;
      const requireTech = document.getElementById('techFilter').checked;

      const filtered = allPrograms.filter(prog => {
        const name = (prog['Program'] || '').toLowerCase();
        const city = (prog['City'] || '').toLowerCase();
        const progState = (prog['State'] || '').trim();
        const progInterest = (prog['Interest'] || '').trim();
        const progSetting = (prog['Setting'] || '').trim();
        const progCompetitiveness = (prog['Competitiveness'] || '').trim();
        
        const matchesSearch = name.includes(searchVal) || city.includes(searchVal);
        const matchesState = selectedFilters.state.size === 0 || selectedFilters.state.has(progState);
        const matchesInterest = selectedFilters.interest.size === 0 || selectedFilters.interest.has(progInterest);
        const matchesSetting = selectedFilters.setting.size === 0 || selectedFilters.setting.has(progSetting);
        const matchesCompetitiveness = selectedFilters.competitiveness.size === 0 || selectedFilters.competitiveness.has(progCompetitiveness);

        const classSizeNum = parseInt(prog['Class size']);
        const matchesClassSize = isNaN(classSizeNum) || classSizeNum <= maxClassSize;

        const matchesParking = !requireParking || isTrueValue(prog['Free Parking'] || prog['Parking']);
        const matchesHousing = !requireHousing || isTrueValue(prog['Housing Stipend'] || prog['Housing']);
        const matchesMeal = !requireMeal || isTrueValue(prog['Meal Stipend'] || prog['Meals']);
        const matchesTech = !requireTech || isTrueValue(prog['Tech Stipend'] || prog['Tech']);

        return matchesSearch && matchesState && matchesInterest && matchesSetting && 
               matchesCompetitiveness && matchesClassSize && matchesParking && 
               matchesHousing && matchesMeal && matchesTech;
      });

      renderSidebarList(filtered);

      const visibleNames = new Set(filtered.map(p => p['Program']));
      markersMap.forEach((marker, progName) => {
        if (visibleNames.has(progName)) {
          if (!map.hasLayer(marker)) map.addLayer(marker);
        } else {
          if (map.hasLayer(marker)) map.removeLayer(marker);
        }
      });
    }

    Papa.parse('programs.csv', {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        allPrograms = results.data;
        initMap();
        setupDropdownControls();
        populateDropdowns(allPrograms);
        createMapPins(allPrograms);
        renderSidebarList(allPrograms);
      }
    });

    document.getElementById('searchInput').addEventListener('input', applyFilters);

    document.getElementById('classSizeFilter').addEventListener('input', function(e) {
      document.getElementById('classSizeValue').innerText = e.target.value;
      applyFilters();
    });

    document.getElementById('parkingFilter').addEventListener('change', applyFilters);
    document.getElementById('housingFilter').addEventListener('change', applyFilters);
    document.getElementById('mealFilter').addEventListener('change', applyFilters);
    document.getElementById('techFilter').addEventListener('change', applyFilters);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pediatric Residency Tracker</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-main: #2b2d42;
      --text-muted: #6c757d;
      --accent: #1d3557;
      --accent-hover: #457b9d;
      --highlight: #e63946;
      --border: #dee2e6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar Layout */
    aside {
      width: 400px;
      background-color: var(--card-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
      z-index: 10;
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-header h1 {
      font-size: 1.25rem;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .search-box {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box:focus {
      border-color: var(--accent);
    }

    .program-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .program-item {
      padding: 12px 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 8px;
      background-color: #fff;
      border: 1px solid var(--border);
      transition: all 0.2s ease;
    }

    .program-item:hover {
      background-color: #f1f3f5;
      border-color: var(--accent-hover);
    }

    .program-item.active {
      border-color: var(--accent);
      background-color: #f8f9fa;
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .program-name {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .program-location {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Map Layout */
    #map {
      flex: 1;
      height: 100%;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside>
    <div class="sidebar-header">
      <h1>Residency Tracker</h1>
      <input type="text" id="searchInput" class="search-box" placeholder="Search programs or locations..." oninput="filterPrograms()">
    </div>
    <div id="programList" class="program-list">
      <!-- Program items rendered via JavaScript -->
    </div>
  </aside>

  <!-- Interactive Map -->
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Sample Residency Dataset
    const programs = [
      { id: '1', name: 'Carolinas Medical Center', location: 'Charlotte, NC', lat: 35.2271, lng: -80.8431, details: 'Clinical Volume: High | Autonomy: Strong' },
      { id: '2', name: 'Duke University Hospital', location: 'Durham, NC', lat: 36.0014, lng: -78.9382, details: 'Clinical Volume: High | Research Focus' },
      { id: '3', name: 'UNC Chapel Hill Hospital', location: 'Chapel Hill, NC', lat: 35.9132, lng: -79.0558, details: 'Balanced academic/community feel' },
      { id: '4', name: 'Vanderbilt University Medical Center', location: 'Nashville, TN', lat: 36.1447, lng: -86.8027, details: 'Strong pediatric subspecialties' }
    ];

    let map;
    let markerMap = new Map();
    let programMap = new Map();
    let activeMarker = null;
    let activeItemElement = null;

    // Initialize Map centered around North Carolina / Southeast
    function initMap() {
      map = L.map('map').setView([35.5, -80.0], 7);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      renderPrograms(programs);
    }

    // Custom icon creator function for normal vs active/selected pins
    function createMarkerIcon(isActive = false) {
      return L.divIcon({
        className: 'custom-map-pin',
        html: `<div style="
          background-color: ${isActive ? '#e63946' : '#1d3557'};
          width: ${isActive ? '24px' : '14px'};
          height: ${isActive ? '24px' : '14px'};
          border-radius: 50%;
          border: 3px solid #ffffff;
          box-shadow: 0 2px 6px rgba(0,0,0,0.3);
          transition: all 0.25s ease-in-out;
          transform: translate(-50%, -50%);
        "></div>`,
        iconSize: [0, 0]
      });
    }

    // Render sidebar items and plot pins on map
    function renderPrograms(dataToRender) {
      const listContainer = document.getElementById('programList');
      listContainer.innerHTML = '';

      // Clear existing markers if re-rendering
      markerMap.forEach(marker => marker.remove());
      markerMap.clear();
      programMap.clear();

      dataToRender.forEach(prog => {
        programMap.set(prog.id, prog);

        // Create sidebar element
        const itemEl = document.createElement('div');
        itemEl.className = 'program-item';
        itemEl.id = `item-${prog.id}`;
        itemEl.innerHTML = `
          <div class="program-name">${prog.name}</div>
          <div class="program-location">${prog.location}</div>
        `;
        itemEl.onclick = () => selectProgramFromSidebar(prog.id);
        listContainer.appendChild(itemEl);

        // Create Leaflet Marker
        const marker = L.marker([prog.lat, prog.lng], { icon: createMarkerIcon(false) })
          .bindPopup(`<b>${prog.name}</b><br>${prog.location}<br><br>${prog.details}`);

        marker.on('click', () => {
          selectProgramFromSidebar(prog.id);
        });

        marker.addTo(map);
        markerMap.set(prog.id, marker);
      });
    }

    // Filter functionality for search box
    function filterPrograms() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = programs.filter(p => 
        p.name.toLowerCase().includes(query) || p.location.toLowerCase().includes(query)
      );
      renderPrograms(filtered);
    }

    // Selection handler: smooth pan (no aggressive zoom), enlarge pin, highlight sidebar item
    function selectProgramFromSidebar(programId) {
      const programData = programMap.get(programId);
      const marker = markerMap.get(programId);

      if (!marker) return;

      // 1. Reset previous active marker style
      if (activeMarker && activeMarker !== marker) {
        activeMarker.setIcon(createMarkerIcon(false));
        activeMarker.setZIndexOffset(0);
      }

      // 2. Highlight selected marker with new size and color
      marker.setIcon(createMarkerIcon(true));
      marker.setZIndexOffset(1000); // Bring marker to front
      activeMarker = marker;

      // 3. Highlight sidebar card
      if (activeItemElement) {
        activeItemElement.classList.remove('active');
      }
      const currentItemEl = document.getElementById(`item-${programId}`);
      if (currentItemEl) {
        currentItemEl.classList.add('active');
        currentItemEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        activeItemElement = currentItemEl;
      }

      // 4. Smoothly pan to marker coordinates WITHOUT changing current zoom level
      map.panTo(marker.getLatLng(), {
        animate: true,
        duration: 0.5
      });

      // 5. Open popup info window automatically
      marker.openPopup();
    }

    // Initialize on window load
    window.onload = initMap;
  </script>
</body>
</html>

        let markers = [];

        function initMap() {
            map = L.map('map').setView([38.5, -96.0], 4);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);
            populateStateDropdown();
            filterPrograms();
        }

        function populateStateDropdown() {
            const states = [...new Set(programsData.map(p => p.state))].sort();
            const select = document.getElementById('filter-state');
            states.forEach(state => {
                const opt = document.createElement('option');
                opt.value = state;
                opt.innerText = state;
                select.appendChild(opt);
            });
        }

        function updateMapMarkers(data) {
            markers.forEach(marker => map.removeLayer(marker));
            markers = [];

            data.forEach(prog => {
                if(prog.lat && prog.lng) {
                    const popupContent = `
                        <div class="p-2 space-y-2 text-xs" style="min-width: 220px;">
                            <h3 class="font-bold text-sm text-softdark">
                                <a href="${prog.url}" target="_blank" class="text-accent hover:underline flex items-center gap-1">
                                    ${prog.name} 
                                    <svg class="w-3 h-3 inline" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                                </a>
                            </h3>
                            <p class="text-taupe"><strong>Location:</strong> ${prog.city}, ${prog.state}</p>
                            <p class="text-taupe"><strong>Setting:</strong> ${prog.setting}</p>
                            <p class="text-taupe"><strong>Class Size:</strong> ${prog.classSize}</p>
                            <p class="text-taupe"><strong>Tier:</strong> ${prog.competitiveness || 'N/A'}</p>
                            <hr class="border-warmbeige">
                            <div class="grid grid-cols-2 gap-1 text-[11px]">
                                <div><strong>Hours/Wk:</strong> ${prog.hours}</div>
                                <div><strong>Step Range:</strong> ${prog.stepRange}</div>
                                <div><strong>Vacation:</strong> ${prog.vacation} days</div>
                                <div><strong>Salary:</strong> ${prog.salary}</div>
                            </div>
                        </div>
                    `;
                    const marker = L.marker([prog.lat, prog.lng]).addTo(map)
                        .bindPopup(popupContent);
                    markers.push(marker);
                }
            });
        }

        function renderProgramList(data) {
            const listContainer = document.getElementById('program-list');
            listContainer.innerHTML = '';

            if(data.length === 0) {
                listContainer.innerHTML = `<div class="p-6 bg-white rounded-xl border border-warmbeige text-center text-taupe text-sm">No programs match your filters.</div>`;
                return;
            }

            data.forEach(prog => {
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-xl border border-warmbeige shadow-sm hover:border-accent transition cursor-pointer";
                card.onclick = () => {
                    map.setView([prog.lat, prog.lng], 11);
                    markers.find(m => m.getLatLng().lat === prog.lat && m.getLatLng().lng === prog.lng)?.openPopup();
                };
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-xs text-taupe font-semibold">${prog.city}, ${prog.state}</p>
                            <h3 class="font-bold text-softdark text-sm mt-0.5">${prog.name}</h3>
                        </div>
                        <span class="px-2 py-0.5 bg-warmbeige text-softdark rounded text-[10px] font-semibold">${prog.competitiveness || 'Target'}</span>
                    </div>
                    <div class="mt-3 flex justify-between items-center text-xs text-taupe">
                        <span>${prog.setting}</span>
                        <span class="text-accent font-semibold hover:underline">View on Map &rarr;</span>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        function filterPrograms() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const state = document.getElementById('filter-state').value;
            const setting = document.getElementById('filter-setting').value;
            const tier = document.getElementById('filter-tier').value;

            const parking = document.getElementById('check-parking').checked;
            const housing = document.getElementById('check-housing').checked;
            const meals = document.getElementById('check-meals').checked;
            const tech = document.getElementById('check-tech').checked;

            const filtered = programsData.filter(prog => {
                const matchesQuery = prog.name.toLowerCase().includes(query) || prog.city.toLowerCase().includes(query);
                const matchesState = state === "" || prog.state === state;
                const matchesSetting = setting === "" || prog.setting === setting;
                const matchesTier = tier === "" || (prog.competitiveness && prog.competitiveness.includes(tier));

                const matchesParking = !parking || prog.parking === 'Y';
                const matchesHousing = !housing || prog.housing === 'Y';
                const matchesMeals = !meals || prog.meals === 'Y';
                const matchesTech = !tech || prog.tech === 'Y';

                return matchesQuery && matchesState && matchesSetting && matchesTier && matchesParking && matchesHousing && matchesMeals && matchesTech;
            });

            renderProgramList(filtered);
            updateMapMarkers(filtered);
        }

        window.addEventListener('DOMContentLoaded', () => {
            initMap();
        });
    </script>
</body>
</html>

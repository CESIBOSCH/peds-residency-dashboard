<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pediatric Residency Dashboard</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- PapaParse for reading CSV files -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  
  <!-- Leaflet CSS & JS for Interactive Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { 
      background-color: #fcfbf9; 
      color: #4a4540; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }
    .leaflet-popup-content-wrapper {
      background: #fafaf9;
      border-radius: 12px;
      padding: 4px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      border: 1px solid #e7e5e4;
    }
    .leaflet-popup-tip {
      background: #fafaf9;
    }
    input[type=range]::-webkit-slider-thumb {
      background: #57534e;
    }
    /* Custom Scrollbar for Sidebar */
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background-color: #e7e5e4;
      border-radius: 4px;
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col md:flex-row">

  <!-- LEFT SIDEBAR: Controls & Program List -->
  <aside class="w-full md:w-[420px] lg:w-[480px] h-full bg-stone-50 border-r border-stone-200 flex flex-col z-20 shadow-lg">
    
    <!-- Header -->
    <div class="p-5 border-b border-stone-200 bg-stone-100/60">
      <h1 class="text-xl font-light tracking-wide text-stone-800">Pediatric Residency Dashboard</h1>
      <p class="text-xs text-stone-500 mt-0.5">Filter programs & explore locations</p>
    </div>

    <!-- Filters Container -->
    <div class="p-4 border-b border-stone-200/80 bg-stone-50 space-y-3">
      
      <!-- Search Input -->
      <input 
        type="text" 
        id="searchInput" 
        placeholder="Search program, city..." 
        class="w-full px-3.5 py-2 rounded-lg bg-white border border-stone-200 text-stone-800 placeholder-stone-400 focus:outline-none focus:ring-2 focus:ring-stone-300 text-sm transition"
      />

      <!-- Dropdown Filters Grid -->
      <div class="grid grid-cols-2 gap-2">
        <select id="stateFilter" class="w-full px-3 py-1.5 rounded-lg bg-white border border-stone-200 text-stone-800 text-xs focus:outline-none focus:ring-2 focus:ring-stone-300">
          <option value="">All States</option>
        </select>

        <select id="interestFilter" class="w-full px-3 py-1.5 rounded-lg bg-white border border-stone-200 text-stone-800 text-xs focus:outline-none focus:ring-2 focus:ring-stone-300">
          <option value="">All Interests</option>
        </select>

        <select id="settingFilter" class="w-full px-3 py-1.5 rounded-lg bg-white border border-stone-200 text-stone-800 text-xs focus:outline-none focus:ring-2 focus:ring-stone-300">
          <option value="">All Settings</option>
        </select>

        <select id="competitivenessFilter" class="w-full px-3 py-1.5 rounded-lg bg-white border border-stone-200 text-stone-800 text-xs focus:outline-none focus:ring-2 focus:ring-stone-300">
          <option value="">All Competitiveness</option>
        </select>
      </div>

      <!-- Class Size Slider -->
      <div class="pt-1 flex items-center gap-2">
        <span class="text-[11px] font-semibold uppercase text-stone-500 tracking-wider">Max Class:</span>
        <input 
          type="range" 
          id="classSizeFilter" 
          min="1" 
          max="50" 
          value="50" 
          class="w-full h-1 bg-stone-200 rounded-lg appearance-none cursor-pointer accent-stone-700"
        />
        <span id="classSizeValue" class="text-xs font-medium bg-stone-200 text-stone-700 px-2 py-0.5 rounded text-center min-w-[2.5rem]">50+</span>
      </div>

      <!-- Perks Checkboxes -->
      <div class="pt-1 flex flex-wrap gap-x-3 gap-y-1 text-xs text-stone-600">
        <label class="inline-flex items-center gap-1 cursor-pointer">
          <input type="checkbox" id="parkingFilter" class="rounded border-stone-300 text-stone-700 focus:ring-stone-400">
          Parking
        </label>
        <label class="inline-flex items-center gap-1 cursor-pointer">
          <input type="checkbox" id="housingFilter" class="rounded border-stone-300 text-stone-700 focus:ring-stone-400">
          Housing
        </label>
        <label class="inline-flex items-center gap-1 cursor-pointer">
          <input type="checkbox" id="mealFilter" class="rounded border-stone-300 text-stone-700 focus:ring-stone-400">
          Meals
        </label>
        <label class="inline-flex items-center gap-1 cursor-pointer">
          <input type="checkbox" id="techFilter" class="rounded border-stone-300 text-stone-700 focus:ring-stone-400">
          Tech
        </label>
      </div>
    </div>

    <!-- Scrollable Program Cards List -->
    <div id="programList" class="flex-1 overflow-y-auto p-4 space-y-3 custom-scroll">
      <!-- Cards dynamically injected here -->
    </div>

  </aside>

  <!-- RIGHT SIDE: Full Screen Map -->
  <main class="flex-1 h-full relative">
    <div id="map" class="w-full h-full"></div>
  </main>

  <script>
    let allPrograms = [];
    let map;
    let markersMap = new Map(); // Store markers linked to program names
    const geocodeCache = {};

    // Approximate US City Coordinates Backup for Instant Pin Placement
    const cityCoordinates = {
      "Phoenix, AZ": [33.4484, -112.0740],
      "Los Angeles, CA": [34.0522, -118.2437],
      "San Francisco, CA": [37.7749, -122.4194],
      "Oakland, CA": [37.8044, -122.2712],
      "Sacramento, CA": [38.5816, -121.4944],
      "San Diego, CA": [32.7157, -117.1611],
      "New Haven, CT": [41.3083, -72.9279],
      "Denver, CO": [39.7392, -104.9903],
      "Washington, DC": [38.9072, -77.0369],
      "Chicago, IL": [41.8781, -87.6298],
      "Boston, MA": [42.3601, -71.0589],
      "Baltimore, MD": [39.2904, -76.6122],
      "Ann Arbor, MI": [42.2808, -83.7430],
      "Minneapolis, MN": [44.9778, -93.2650],
      "St. Louis, MO": [38.6270, -90.1994],
      "Chapel Hill, NC": [35.9132, -79.0558],
      "Charlotte, NC": [35.2271, -80.8431],
      "Philadelphia, PA": [39.9526, -75.1652],
      "Pittsburgh, PA": [40.4406, -79.9959],
      "Seattle, WA": [47.6062, -122.3321]
    };

    function initMap() {
      map = L.map('map').setView([39.8283, -98.5795], 4);
      
      L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(map);
    }

    function populateDropdowns(data) {
      const stateSelect = document.getElementById('stateFilter');
      const interestSelect = document.getElementById('interestFilter');
      const settingSelect = document.getElementById('settingFilter');
      const competitivenessSelect = document.getElementById('competitivenessFilter');

      const states = new Set();
      const interests = new Set();
      const settings = new Set();
      const competitivenessSet = new Set();
      let maxClassFound = 0;

      data.forEach(prog => {
        if (prog['State']) states.add(prog['State'].trim());
        if (prog['Interest']) interests.add(prog['Interest'].trim());
        if (prog['Setting']) settings.add(prog['Setting'].trim());
        if (prog['Competitiveness']) competitivenessSet.add(prog['Competitiveness'].trim());
        
        const size = parseInt(prog['Class size']);
        if (!isNaN(size) && size > maxClassFound) maxClassFound = size;
      });

      Array.from(states).sort().forEach(val => stateSelect.add(new Option(val, val)));
      interests.forEach(val => interestSelect.add(new Option(val, val)));
      settings.forEach(val => settingSelect.add(new Option(val, val)));
      competitivenessSet.forEach(val => competitivenessSelect.add(new Option(val, val)));

      if (maxClassFound > 0) {
        const slider = document.getElementById('classSizeFilter');
        slider.max = maxClassFound;
        slider.value = maxClassFound;
        document.getElementById('classSizeValue').innerText = maxClassFound + "+";
      }
    }

    // Parse CSV
    Papa.parse('programs.csv', {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        allPrograms = results.data;
        initMap();
        populateDropdowns(allPrograms);
        createMapPins(allPrograms);
        renderSidebarList(allPrograms);
      }
    });

    function isTrueValue(val) {
      if (!val) return false;
      const cleanVal = String(val).trim().toLowerCase();
      return ['yes', 'true', '1', 'x', 'y'].includes(cleanVal);
    }

    // Place Map Pins
    function createMapPins(programs) {
      programs.forEach(prog => {
        const programName = prog['Program'] || 'N/A';
        const city = (prog['City'] || '').trim();
        const state = (prog['State'] || '').trim();
        const cityStateKey = `${city}, ${state}`;

        let lat = parseFloat(prog['Latitude'] || prog['lat']);
        let lng = parseFloat(prog['Longitude'] || prog['lng']);

        // Check Backup Lookup Table if lat/lng not in CSV
        if ((isNaN(lat) || isNaN(lng)) && cityCoordinates[cityStateKey]) {
          [lat, lng] = cityCoordinates[cityStateKey];
        }

        if (!isNaN(lat) && !isNaN(lng)) {
          const marker = L.marker([lat, lng]).addTo(map);
          
          const popupContent = `
            <div class="p-2 font-sans text-stone-800">
              <h3 class="font-semibold text-sm mb-1">${programName}</h3>
              <p class="text-xs text-stone-500 mb-2">${city}${city && state ? ', ' : ''}${state}</p>
              <div class="text-xs space-y-1 text-stone-600">
                <p><span class="font-medium text-stone-700">Interest:</span> ${prog['Interest'] || '-'}</p>
                <p><span class="font-medium text-stone-700">Setting:</span> ${prog['Setting'] || '-'}</p>
                <p><span class="font-medium text-stone-700">Class Size:</span> ${prog['Class size'] || '-'}</p>
                <p><span class="font-medium text-stone-700">Competitiveness:</span> ${prog['Competitiveness'] || '-'}</p>
              </div>
            </div>
          `;
          
          marker.bindPopup(popupContent);
          markersMap.set(programName, marker);
        }
      });
    }

    // Render Sidebar Cards
    function renderSidebarList(programs) {
      const listContainer = document.getElementById('programList');
      listContainer.innerHTML = '';

      if (programs.length === 0) {
        listContainer.innerHTML = `<p class="text-xs text-stone-400 text-center py-8">No programs match your filters.</p>`;
        return;
      }

      programs.forEach(prog => {
        const programName = prog['Program'] || 'N/A';
        const city = prog['City'] || '';
        const state = prog['State'] || '';
        const interest = prog['Interest'] || '-';
        const setting = prog['Setting'] || '-';

        const card = document.createElement('div');
        card.className = "p-3.5 bg-white rounded-xl border border-stone-200/80 shadow-sm hover:border-stone-300 hover:shadow-md transition cursor-pointer";
        
        card.innerHTML = `
          <div class="flex justify-between items-start gap-2">
            <h3 class="font-medium text-stone-800 text-sm leading-snug">${programName}</h3>
            <span class="text-[10px] font-semibold uppercase px-2 py-0.5 bg-stone-100 text-stone-600 rounded-md border border-stone-200/60 shrink-0">${interest}</span>
          </div>
          <p class="text-xs text-stone-500 mt-1">${city}${city && state ? ', ' : ''}${state}</p>
          <div class="mt-2.5 pt-2 border-t border-stone-100 flex justify-between text-[11px] text-stone-500">
            <span>Setting: <strong class="text-stone-700 font-normal">${setting}</strong></span>
            <span>Class: <strong class="text-stone-700 font-normal">${prog['Class size'] || '-'}</strong></span>
          </div>
        `;

        // Click card to pan map to program location
        card.addEventListener('click', () => {
          const marker = markersMap.get(programName);
          if (marker) {
            map.flyTo(marker.getLatLng(), 11, { duration: 1.2 });
            marker.openPopup();
          }
        });

        listContainer.appendChild(card);
      });
    }

    // Dynamic Multi-Filter Execution
    function applyFilters() {
      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      const stateVal = document.getElementById('stateFilter').value;
      const interestVal = document.getElementById('interestFilter').value;
      const settingVal = document.getElementById('settingFilter').value;
      const competitivenessVal = document.getElementById('competitivenessFilter').value;
      
      const maxClassSize = parseInt(document.getElementById('classSizeFilter').value);
      const sliderMax = parseInt(document.getElementById('classSizeFilter').max);

      const requireParking = document.getElementById('parkingFilter').checked;
      const requireHousing = document.getElementById('housingFilter').checked;
      const requireMeal = document.getElementById('mealFilter').checked;
      const requireTech = document.getElementById('techFilter').checked;

      const filtered = allPrograms.filter(prog => {
        const name = (prog['Program'] || '').toLowerCase();
        const city = (prog['City'] || '').toLowerCase();
        
        const matchesSearch = name.includes(searchVal) || city.includes(searchVal);
        const matchesState = !stateVal || (prog['State'] || '').trim() === stateVal;
        const matchesInterest = !interestVal || (prog['Interest'] || '').trim() === interestVal;
        const matchesSetting = !settingVal || (prog['Setting'] || '').trim() === settingVal;
        const matchesCompetitiveness = !competitivenessVal || (prog['Competitiveness'] || '').trim() === competitivenessVal;

        const classSizeNum = parseInt(prog['Class size']);
        const matchesClassSize = isNaN(classSizeNum) || maxClassSize === sliderMax || classSizeNum <= maxClassSize;

        const matchesParking = !requireParking || isTrueValue(prog['Free Parking'] || prog['Parking']);
        const matchesHousing = !requireHousing || isTrueValue(prog['Housing Stipend'] || prog['Housing']);
        const matchesMeal = !requireMeal || isTrueValue(prog['Meal Stipend'] || prog['Meals']);
        const matchesTech = !requireTech || isTrueValue(prog['Tech Stipend'] || prog['Tech']);

        return matchesSearch && matchesState && matchesInterest && matchesSetting && 
               matchesCompetitiveness && matchesClassSize && matchesParking && 
               matchesHousing && matchesMeal && matchesTech;
      });

      // Update Sidebar Cards
      renderSidebarList(filtered);

      // Show/Hide Map Markers dynamically based on filter
      const visibleNames = new Set(filtered.map(p => p['Program']));
      markersMap.forEach((marker, progName) => {
        if (visibleNames.has(progName)) {
          if (!map.hasLayer(marker)) map.addLayer(marker);
        } else {
          if (map.hasLayer(marker)) map.removeLayer(marker);
        }
      });
    }

    // Event Listeners
    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('stateFilter').addEventListener('change', applyFilters);
    document.getElementById('interestFilter').addEventListener('change', applyFilters);
    document.getElementById('settingFilter').addEventListener('change', applyFilters);
    document.getElementById('competitivenessFilter').addEventListener('change', applyFilters);

    document.getElementById('classSizeFilter').addEventListener('input', function(e) {
      const val = e.target.value;
      const max = e.target.max;
      document.getElementById('classSizeValue').innerText = val == max ? val + "+" : "≤ " + val;
      applyFilters();
    });

    document.getElementById('parkingFilter').addEventListener('change', applyFilters);
    document.getElementById('housingFilter').addEventListener('change', applyFilters);
    document.getElementById('mealFilter').addEventListener('change', applyFilters);
    document.getElementById('techFilter').addEventListener('change', applyFilters);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pediatric Residency Tracker</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F8F9FA;
            --surface-color: #FFFFFF;
            --border-color: #E2E8F0;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --primary: #0F766E;
            --primary-light: #F0FDFA;
            --accent: #0D9488;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            padding: 1.25rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        header p {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .main-container {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 440px;
            gap: 1.5rem;
            padding: 1.5rem;
            max-width: 1700px;
            margin: 0 auto;
            width: 100%;
        }

        @media (max-width: 1200px) {
            .main-container {
                grid-template-columns: 1fr;
            }
            #map {
                height: 400px !important;
            }
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .map-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        #map {
            width: 100%;
            height: 480px;
        }

        .table-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex: 1;
        }

        .filter-bar {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 1rem;
            align-items: center;
            background: #FAFAFA;
        }

        .filter-bar input, .filter-bar select {
            padding: 0.55rem 0.875rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.875rem;
            outline: none;
            background: var(--surface-color);
            color: var(--text-main);
            transition: border-color 0.2s;
        }

        .filter-bar input:focus, .filter-bar select:focus {
            border-color: var(--primary);
        }

        .filter-bar input {
            flex: 1;
        }

        .table-responsive {
            overflow-x: auto;
            max-height: 500px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.875rem;
        }

        th {
            background: #F8FAFC;
            color: var(--text-muted);
            font-weight: 600;
            padding: 0.875rem 1rem;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 0.875rem 1rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
        }

        tr:hover td {
            background-color: var(--primary-light);
            cursor: pointer;
        }

        /* Right Panel: Detail View */
        .right-panel {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            height: fit-content;
            position: sticky;
            top: 1.5rem;
        }

        .detail-header h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.25rem;
        }

        .detail-header p {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.875rem;
        }

        .metric-box {
            background: #F8FAFC;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.875rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }

        .metric-value {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.625rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            background: var(--primary-light);
            color: var(--primary);
            width: fit-content;
        }

        .empty-selection {
            text-align: center;
            color: var(--text-muted);
            padding: 3rem 1rem;
            font-size: 0.9375rem;
        }

        .actions-bar {
            display: flex;
            gap: 0.75rem;
            margin-top: auto;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .btn {
            flex: 1;
            padding: 0.625rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border-color);
            text-align: center;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background: var(--accent);
        }

        .btn-secondary {
            background: var(--surface-color);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background: #F8FAFC;
        }
    </style>
</head>

    <header>
        <div>
            <h1>Pediatric Residency Tracker</h1>
            <p>Clean Dashboard • Filterable Program Dataset (37 Programs)</p>
        </div>
        <div style="font-size: 0.875rem; font-weight: 600; color: var(--primary);">

    </header>

    <div class="main-container">
        <!-- Left Panel: Map & Table -->
        <div class="left-panel">
            <div class="map-card">
                <div id="map"></div>
            </div>

            <div class="table-card">
                <div class="filter-bar">
                    <input type="text" id="search-input" placeholder="Search program, city, or state..." oninput="filterData()">
                    <select id="setting-filter" onchange="filterData()">
                        <option value="">All Settings</option>
                        <option value="University">University</option>
                        <option value="CB/University Affiliated">CB/University Affiliated</option>
                    </select>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Program</th>
                                <th>Location</th>
                                <th>Setting</th>
                                <th>Class Size</th>
                                <th>Step Score Range</th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                            <!-- Populated via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Right Panel: Program Details -->
        <div class="right-panel" id="detail-panel">
            <div class="empty-selection">
                Select a program from the list or map to view complete metrics, stipends, and shift schedules.
            </div>
        </div>
    </div>

        let map;
        let markers = [];
        let selectedProgram = null;

        function initMap() {
            map = L.map('map').setView([39.8283, -98.5795], 4);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 18,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            renderMarkers(programs);
        }

        function renderMarkers(data) {
            markers.forEach(m => map.removeLayer(m));
            markers = [];

            data.forEach((p, index) => {
                if (p.Lat && p.Lng) {
                    const marker = L.marker([p.Lat, p.Lng]).addTo(map);
                    marker.bindPopup(`<b>${p.Program}</b><br>${p.City}, ${p.State}`);
                    marker.on('click', () => selectProgram(index));
                    markers.push(marker);
                }
            });
        }

        function renderTable(data) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            data.forEach((p, index) => {
                const tr = document.createElement('tr');
                tr.onclick = () => selectProgram(programs.indexOf(p));
                tr.innerHTML = `
                    <td style="font-weight: 600;">${p.Program}</td>
                    <td>${p.City}, ${p.State}</td>
                    <td><span class="badge">${p.Setting}</span></td>
                    <td>${p['Class size']}</td>
                    <td>${p['Step Score Range']}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('active-count').innerText = data.length;
        }

        function selectProgram(index) {
            selectedProgram = programs[index];
            const panel = document.getElementById('detail-panel');
            
            panel.innerHTML = `
                <div class="detail-header">
                    <h2>${selectedProgram.Program}</h2>
                    <p>${selectedProgram.City}, ${selectedProgram.State} • <span class="badge">${selectedProgram.Setting}</span></p>
                </div>

                <div class="metrics-grid">
                    <div class="metric-box">
                        <span class="metric-label">Class Size</span>
                        <span class="metric-value">${selectedProgram['Class size']} residents</span>
                    </div>
                    <div class="metric-box">
                        <span class="metric-label">Step Score Range</span>
                        <span class="metric-value">${selectedProgram['Step Score Range']}</span>
                    </div>
                    <div class="metric-box">
                        <span class="metric-label">Salary</span>
                        <span class="metric-value">${selectedProgram.Salary}</span>
                    </div>
                    <div class="metric-box">
                        <span class="metric-label">COL Adjusted</span>
                        <span class="metric-value">${selectedProgram['COL-Adjusted Salary']}</span>
                    </div>
                    <div class="metric-box">
                        <span class="metric-label">Work Hours / Wk</span>
                        <span class="metric-value">${selectedProgram['Hours/Week']} hrs</span>
                    </div>
                    <div class="metric-box">
                        <span class="metric-label">Longest Shift</span>
                        <span class="metric-value">${selectedProgram['Longest Shift']} hrs</span>
                    </div>
                    <div class="metric-box">
                        <span class="metric-label">Vacation Days</span>
                        <span class="metric-value">${selectedProgram['Vacation Days']} days</span>
                    </div>
                    <div class="metric-box">
                        <span class="metric-label">Family Leave</span>
                        <span class="metric-value">${selectedProgram['Family Leave Paid/Unpaid'] || 'Standard'}</span>
                    </div>
                </div>

                <div class="actions-bar">
                    <button class="btn btn-primary" onclick="alert('Program saved to shortlist!')">Save to Shortlist</button>
                    <button class="btn btn-secondary" onclick="window.open('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent('${selectedProgram.Program} ${selectedProgram.City} ${selectedProgram.State}'), '_blank')">View Map</button>
                </div>
            `;

            if (selectedProgram.Lat && selectedProgram.Lng) {
                map.setView([selectedProgram.Lat, selectedProgram.Lng], 10, { animate: true });
            }
        }

        function filterData() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const setting = document.getElementById('setting-filter').value;

            const filtered = programs.filter(p => {
                const matchesQuery = p.Program.toLowerCase().includes(query) || 
                                     p.City.toLowerCase().includes(query) || 
                                     p.State.toLowerCase().includes(query);
                const matchesSetting = setting === '' || p.Setting === setting;
                return matchesQuery && matchesSetting;
            });

            renderTable(filtered);
            renderMarkers(filtered);
        }

        // Initial load
        window.onload = () => {
            initMap();
            renderTable(programs);
        };
    </script>

    <style>
        :root {
            --bg-color: #f8fafc;
            --sidebar-bg: #ffffff;
            --map-bg: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-light: #64748b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --border-color: #e2e8f0;
            --header-title-color: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: #ffffff;
            padding: 16px 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 1.85rem;
            font-weight: 600;
            color: var(--header-title-color);
            text-align: center;
            letter-spacing: -0.025em;
        }

        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 73px);
            overflow: hidden;
        }

        /* Sidebar */
        aside {
            width: 380px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100%;
            z-index: 10;
        }

        .filters-section {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            background-color: #fcfcfc;
        }

        .filter-group {
            margin-bottom: 14px;
        }

        .filter-group:last-child {
            margin-bottom: 0;
        }

        .filter-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-light);
            margin-bottom: 6px;
        }

        .filter-group input, .filter-group select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
            background: #ffffff;
        }

        .filter-group input:focus, .filter-group select:focus {
            border-color: var(--primary);
        }

        .programs-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .program-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .program-card:hover {
            border-color: var(--primary);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .program-card.active {
            border-color: var(--primary);
            background-color: #eff6ff;
        }

        .program-card h3 {
            font-size: 1rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 4px;
        }

        .program-card p {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 2px;
        }

        .tag {
            display: inline-block;
            padding: 2px 8px;
            font-size: 0.75rem;
            font-weight: 500;
            border-radius: 12px;
            margin-top: 6px;
            background-color: #e0f2fe;
            color: #0369a1;
        }

        /* Map Container */
        #map {
            flex: 1;
            height: 100%;
            background-color: var(--map-bg);
            z-index: 1;
        }

        /* Leaflet popup customization */
        .leaflet-popup-content-wrapper {
            border-radius: 8px;
            padding: 4px;
        }

        .leaflet-popup-content h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #1e293b;
        }

        .leaflet-popup-content p {
            font-size: 0.85rem;
            margin-bottom: 4px;
            color: var(--text-main);
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column-reverse;
            }
            aside {
                width: 100%;
                height: 50%;
            }
            #map {
                height: 50%;
            }
        }
    </style>
</head>

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {

        let markersLayer = L.layerGroup().addTo(map);
        let activeCard = null;

        function renderDashboard(filteredData) {
            const listContainer = document.getElementById('programs-list-container');
            listContainer.innerHTML = '';
            markersLayer.clearLayers();

            let bounds = [];

            filteredData.forEach((prog, index) => {
                // Render Card
                const card = document.createElement('div');
                card.className = 'program-card';
                card.innerHTML = `
                    <h3>${prog.Program}</h3>
                    <p><strong>Location:</strong> ${prog.City}, ${prog.State}</p>
                    <p><strong>Setting:</strong> ${prog.Setting}</p>
                    <p><strong>Class Size:</strong> ${prog['Class size']} | <strong>Salary:</strong> ${prog.Salary}</p>
                    <span class="tag">${prog.Interest || 'Considering'}</span>
                `;

                card.addEventListener('click', () => {
                    document.querySelectorAll('.program-card').forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                    
                    const coords = cityCoordinates[prog.City];
                    if (coords) {
                        map.setView(coords, 10, { animate: true });
                    }
                });

                listContainer.appendChild(card);

                // Render Map Marker
                const coords = cityCoordinates[prog.City];
                if (coords) {
                    const marker = L.marker(coords);
                    marker.bindPopup(`
                        <div>
                            <h3>${prog.Program}</h3>
                            <p><strong>Location:</strong> ${prog.City}, ${prog.State}</p>
                            <p><strong>Setting:</strong> ${prog.Setting}</p>
                            <p><strong>Class Size:</strong> ${prog['Class size']}</p>
                            <p><strong>Salary:</strong> ${prog.Salary}</p>
                            <p><strong>Interest:</strong> ${prog.Interest || 'Considering'}</p>
                        </div>
                    `);
                    
                    marker.on('click', () => {
                        document.querySelectorAll('.program-card').forEach(c => c.classList.remove('active'));
                        card.classList.add('active');
                        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    });

                    markersLayer.addLayer(marker);
                    bounds.push(coords);
                }
            });
        }

        function filterData() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const interestFilter = document.getElementById('interest-select').value;

            const filtered = programsData.filter(prog => {
                const matchesSearch = prog.Program.toLowerCase().includes(searchTerm) || prog.City.toLowerCase().includes(searchTerm);
                const matchesInterest = interestFilter === '' || (prog.Interest && prog.Interest.toLowerCase() === interestFilter.toLowerCase());
                return matchesSearch && matchesInterest;
            });

            renderDashboard(filtered);
        }

        document.getElementById('search-input').addEventListener('input', filterData);
        document.getElementById('interest-select').addEventListener('change', filterData);

        // Initial render
        renderDashboard(programsData);
    </script>

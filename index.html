<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pediatric Residency Dashboard</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- PapaParse for reading CSV files -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  
  <!-- Leaflet CSS & JS for Interactive Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { 
      background-color: #fcfbf9; 
      color: #4a4540; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }
    /* Map Popup Custom Styling */
    .leaflet-popup-content-wrapper {
      background: #fafaf9;
      border-radius: 12px;
      padding: 4px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      border: 1px solid #e7e5e4;
    }
    .leaflet-popup-tip {
      background: #fafaf9;
    }
  </style>
</head>
<body class="p-6 md:p-12 max-w-7xl mx-auto">

  <!-- Header Section -->
  <header class="mb-8 pb-6 border-b border-stone-200">
    <h1 class="text-3xl font-light tracking-wide text-stone-800">Pediatric Residency Dashboard</h1>
    <p class="text-sm text-stone-500 mt-1">Master tracking & decision matrix for residency programs</p>
  </header>

  <!-- Controls / Search Section -->
  <div class="flex flex-col sm:flex-row gap-4 mb-6">
    <input 
      type="text" 
      id="searchInput" 
      placeholder="Search program, city, state, setting..." 
      class="w-full sm:w-96 px-4 py-2.5 rounded-lg bg-stone-100 border border-stone-200 text-stone-800 placeholder-stone-400 focus:outline-none focus:ring-2 focus:ring-stone-300 text-sm transition"
    />
  </div>

  <!-- Interactive Map Section -->
  <div class="mb-10">
    <div id="map" class="w-full h-96 rounded-xl border border-stone-200 shadow-sm z-10"></div>
  </div>

  <!-- Program Table Section -->
  <div class="overflow-x-auto bg-stone-50 rounded-xl border border-stone-200 shadow-sm">
    <table class="w-full text-left text-sm text-stone-700">
      <thead class="bg-stone-100/80 border-b border-stone-200 text-stone-500 text-xs uppercase tracking-wider">
        <tr>
          <th class="px-6 py-4 font-medium">Program Name</th>
          <th class="px-6 py-4 font-medium">Location</th>
          <th class="px-6 py-4 font-medium">Setting</th>
          <th class="px-6 py-4 font-medium">Clinical Volume</th>
          <th class="px-6 py-4 font-medium">Autonomy</th>
        </tr>
      </thead>
      <tbody id="tableBody" class="divide-y divide-stone-200/60">
        <!-- Rows dynamically injected here -->
      </tbody>
    </table>
  </div>

  <script>
    let allPrograms = [];
    let map;
    let markers = [];

    // Initialize Leaflet Map centered on the United States
    function initMap() {
      map = L.map('map').setView([39.8283, -98.5795], 4);
      
      // Clean, light CartoDB Positron tile layer matching the minimalist theme
      L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>'
      }).addTo(map);
    }

    // Load CSV Data
    Papa.parse('programs.csv', {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        allPrograms = results.data;
        initMap();
        renderDashboard(allPrograms);
      }
    });

    // Render Table and Map Markers
    function renderDashboard(data) {
      const tableBody = document.getElementById('tableBody');
      tableBody.innerHTML = '';
      
      // Clear existing markers
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      data.forEach(prog => {
        // 1. Add Row to Table
        const tr = document.createElement('tr');
        tr.className = "hover:bg-stone-100/50 transition-colors";
        tr.innerHTML = `
          <td class="px-6 py-4 font-medium text-stone-800">${prog.ProgramName || 'N/A'}</td>
          <td class="px-6 py-4 text-stone-600">${prog.City || ''}, ${prog.State || ''}</td>
          <td class="px-6 py-4 text-stone-600">${prog.Setting || 'N/A'}</td>
          <td class="px-6 py-4 text-stone-600">${prog.ClinicalVolume || 'N/A'}</td>
          <td class="px-6 py-4 text-stone-600">${prog.Autonomy || 'N/A'}</td>
        `;
        tableBody.appendChild(tr);

        // 2. Add Marker to Map if coordinates exist
        const lat = parseFloat(prog.Latitude);
        const lng = parseFloat(prog.Longitude);

        if (!isNaN(lat) && !isNaN(lng)) {
          const marker = L.marker([lat, lng]).addTo(map);
          
          const popupContent = `
            <div class="p-2 font-sans text-stone-800">
              <h3 class="font-semibold text-sm mb-1">${prog.ProgramName}</h3>
              <p class="text-xs text-stone-500 mb-2">${prog.City}, ${prog.State}</p>
              <div class="text-xs space-y-1 text-stone-600">
                <p><span class="font-medium text-stone-700">Setting:</span> ${prog.Setting || 'N/A'}</p>
                <p><span class="font-medium text-stone-700">Volume:</span> ${prog.ClinicalVolume || 'N/A'}</p>
                <p><span class="font-medium text-stone-700">Autonomy:</span> ${prog.Autonomy || 'N/A'}</p>
              </div>
            </div>
          `;
          
          marker.bindPopup(popupContent);
          markers.push({ instance: marker, data: prog });
        }
      });
    }

    // Sync Live Search with Table and Map Markers
    document.getElementById('searchInput').addEventListener('input', function(e) {
      const query = e.target.value.toLowerCase();

      const filtered = allPrograms.filter(prog => {
        const name = (prog.ProgramName || '').toLowerCase();
        const city = (prog.City || '').toLowerCase();
        const state = (prog.State || '').toLowerCase();
        const setting = (prog.Setting || '').toLowerCase();

        return name.includes(query) || city.includes(query) || state.includes(query) || setting.includes(query);
      });

      renderDashboard(filtered);
    });
  </script>
</body>
</html>
